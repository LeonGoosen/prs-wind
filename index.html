 .observationEnable{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}.observationEnable input{width:auto;margin:0}

<body>
<div class="app">
<header>
<div class="brandrow">
  <div style="display:flex;align-items:center;gap:10px"><img src="wind-sight-icon.png" alt="WIND SIGHT PRS" style="width:42px;height:42px;border-radius:10px"><div class="brand"><span style="color:#d9dee7">WIND</span> <span style="color:#009abf">SIGHT</span> <span style="font-size:12px;letter-spacing:.16em;color:#a7b4c3">PRS</span><small>COMPETITION CORE • v3.8.10</small></div></div>
  <button class="save storageButton" id="saveState" type="button" onclick="if(protection.ready){saveCurrent();st.screen='dataProtection';render()}">Checking data…</button>
</div>
<nav id="nav"></nav>
</header>
<div id="storageNotice" class="note" role="status" hidden></div><div id="updateNotice" class="note" role="status" hidden></div><main id="main"></main>
</div>
<div class="bottom" id="bottom"><div class="bottomin"><button class="bigbtn" id="backBtn">← BACK</button><button class="bigbtn primary" id="nextBtn">NEXT →</button></div></div>

<div id="overlay" class="overlay hidden">
  <div class="sheet" id="sheet">
    <div class="cardhead"><div><div class="kicker">Angle tool</div><h2 id="wheelTitle">WIND FROM</h2></div><button class="btn secondary small" id="wheelDone">DONE</button></div>
    <div id="wheelDeg" class="wheelValue">000°</div><div id="wheelClock" class="wheelSub">12:00</div>
    <div class="wheelwrap"><div id="wheel" class="wheel"><div id="pointer" class="pointer"></div><div class="dot"></div></div></div>
    <label>Exact degrees<input id="wheelInput" type="text" inputmode="numeric"></label>
    <div class="note"><strong>Convention:</strong> WIND FROM for wind direction. TARGET DOF for target geometry.</div>
  </div>
</div>

<script>
const SCHEMA_VERSION=4, DBKEY="windSightPRS";
const MAX_TARGETS=10,MAX_POINTS=3,MAX_OBS=3,MAX_INTEL=5;
const LEGACY_KEYS=["windSightPRS_v24","prsWindPlatformV21","prsWindPlatformPrototypeV2"];
let st={screen:"home",step:0,selectedRifle:null,selectedAmmo:null,selectedMatch:null,selectedStage:null,liveStep:0,data:{schemaVersion:SCHEMA_VERSION,rifles:[],matches:[],drafts:{}}};
let saveTimer=null,wheelCtx=null,drag=false;

const IDB_NAME="windSightPRSDB",IDB_STORE="state",IDB_KEY="appData",IDB_TELEMETRY="telemetry";







const iso=()=>new Date().toISOString(), uid=p=>p+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normDec=x=>String(x??"").replace(",",".").trim();
const n=x=>{const raw=normDec(x);if(raw==="")return null;const v=Number(raw);return Number.isFinite(v)?v:null};
function norm(a){a=Number(a);return ((a%360)+360)%360}
function sdelta(a,b){return ((norm(a)-norm(b)+540)%360)-180}
function clock(deg){deg=norm(deg);let total=deg/360*720,mins=Math.round(total)%60,hr=Math.floor(total/60);if(hr===0)hr=12;if(hr>12)hr-=12;return hr+":"+String(mins).padStart(2,"0")}
function migrateData(d){
 if(!d||typeof d!=="object")return {schemaVersion:SCHEMA_VERSION,rifles:[],matches:[]};
 d.schemaVersion=d.schemaVersion||1;
 d.rifles=d.rifles||[]; d.matches=d.matches||[]; d.drafts=d.drafts||{}; d.trash=d.trash||{matches:[]}; d.trash.matches=d.trash.matches||[]; d.lastSavedAt=d.lastSavedAt||null;
 d.matches.forEach(m=>{
   m.stages=m.stages||[];
   m.stages.forEach(s=>{
     s.wind=s.wind||{min:"",avg:"",max:"",now:"",avgDir:"",nowDir:"",window:"10 min"};
     s.points=s.points||[{id:uid("p"),distanceM:"",terrain:"Open / normal",obs:[]}];
     s.targetObs=s.targetObs||[]; s.intel=s.intel||[];
     s.matchIntel=s.matchIntel||null; s.revisionHistory=s.revisionHistory||[];
     s.targets=(s.targets||[]).map(t=>({...t,holdSide:t.holdSide||"L"}));
   });
 });
 d.schemaVersion=SCHEMA_VERSION;
 return d;
}







function saveDraft(kind,obj){if(!canMutateData())return;st.data.drafts=st.data.drafts||{};st.data.drafts[kind]=JSON.parse(JSON.stringify(obj));autosave()}
function loadDraft(kind){const d=st.data.drafts?.[kind]?JSON.parse(JSON.stringify(st.data.drafts[kind])):null;if(d&&kind==="match")return migrateData({rifles:[],matches:[d]}).matches[0];return d;}
function clearDraft(kind){if(!canMutateData())return;if(st.data.drafts)delete st.data.drafts[kind];autosave()}






function navItems(){return [["home","HOME"],["matches","MATCHES"],["rifles","PROFILES"],["reports","REPORTS"],["dataProtection","DATA"]]}
function renderNav(){nav.innerHTML="";navItems().forEach(([k,l])=>{let b=document.createElement("button");b.className="navbtn"+(st.screen===k?" active":"");b.textContent=l;b.onclick=()=>{if(protection.blocked){st.screen="dataProtection";st.step=0;render();return;}saveCurrent();st.screen=k;st.step=0;render()};nav.appendChild(b)})}
function setBottom(show=true,nextLabel="NEXT →",nextVisible=true){bottom.style.display=show?"block":"none";nextBtn.textContent=nextLabel;nextBtn.style.visibility=nextVisible?"visible":"hidden"}

const APP_VERSION="3.8.10";











































































function goTop(){try{window.scrollTo({top:0,left:0,behavior:"auto"})}catch(e){window.scrollTo(0,0)}document.documentElement.scrollTop=0;document.body.scrollTop=0;if(main)main.scrollTop=0}
function render(){goTop();renderNav();main.innerHTML="";({home,rifles,rifleWizard,matches,matchWizard,matchDashboard,dataProtection,liveStage,reports}[st.screen]||home)();applyProtectionUI();goTop();requestAnimationFrame(goTop);setTimeout(goTop,30)}

function saveCurrent(){if(!canMutateData())return;try{if(st.screen==="liveStage")captureLive()}catch(e){}autosave()}
function f(lbl,id,val,mode="text"){let im=mode==="numeric"?"numeric":mode==="decimal"?"decimal":"text",type=mode==="date"?"date":"text",cls=mode==="date"?"dateInput":"";return `<label>${esc(lbl)}<input class="${cls}" id="${id}" type="${type}" inputmode="${im}" autocomplete="off" value="${esc(val??"")}"></label>`}
function ta(lbl,id,val){return `<label>${esc(lbl)}<textarea id="${id}">${esc(val??"")}</textarea></label>`}
function v(id){return document.getElementById(id)?.value??""}
function bindAuto(cb){main.querySelectorAll("input,select,textarea").forEach(el=>{el.addEventListener("input",cb);el.addEventListener("change",cb)})}

function hasReadyProfile(){return st.data.rifles.some(r=>(r.ammo||[]).some(a=>a.name&&a.bullet&&n(a.mv)>0&&(a.bcType||a.bc)));}









function home(){
 setBottom(false);const recentMatches=st.data.matches.filter(m=>!m.archivedAt).slice().reverse().slice(0,4);
 main.innerHTML=`<div class="panel"><div class="kicker">Fast match access</div><h2>WIND SIGHT PRS</h2><p class="sub">${hasReadyProfile()?"Open a match or start a new one.":"Set up your first rifle + ammo combo before creating a match."}</p><div class="actions">${hasReadyProfile()?`<button class="btn" id="newMatch">+ NEW MATCH</button>`:`<button class="btn" id="setupFirst">SET UP FIRST COMBO →</button>`}<button class="btn secondary" id="profilesBtn">PROFILES</button></div></div><div class="panel"><div class="cardhead"><h3>Recent Matches</h3><button class="btn outline small" id="allMatches">VIEW ALL</button></div><div id="recent">${recentMatches.length?recentMatches.map(m=>`<button class="matchCardBtn recentOpen" data-m="${esc(m.id)}"><strong>${esc(m.name)}</strong><span class="small">${esc(m.date||"")} • ${m.stages?.length||0} stages • ${m.completedAt?"Complete":"Active"}</span></button>`).join(""):`<div class="note">No matches yet.</div>`}</div></div><div class="publisherFooter"><div class="small">PRODUCT PUBLISHER</div><img src="zealtech-transparent.png" alt="ZealTech"></div>`;
 document.getElementById("setupFirst")?.addEventListener("click",()=>{st.screen="rifleWizard";st.step=0;st.selectedRifle=null;st.selectedAmmo=null;render()});document.getElementById("newMatch")?.addEventListener("click",()=>{st.screen="matchWizard";st.step=0;st.selectedMatch=null;render()});profilesBtn.onclick=()=>{st.screen="rifles";render()};allMatches.onclick=()=>{st.screen="matches";render()};document.querySelectorAll(".recentOpen").forEach(b=>b.onclick=()=>{st.selectedMatch=b.dataset.m;st.screen="matchDashboard";render()});
}

function profileCombos(){
 const out=[];
 st.data.rifles.forEach(r=>{
   if((r.ammo||[]).length){r.ammo.forEach(a=>out.push({r,a,incomplete:false}))}
   else out.push({r,a:null,incomplete:true});
 });
 return out;
}
async function deleteCombo(rid,aid){return runProtectedChange(async()=>{
 const r=st.data.rifles.find(x=>x.id===rid);if(!r)return;
 if(!confirm(`Delete profile "${r.name}${aid?" + ammo":""}"?`))return;
 if(!confirm("Delete permanently? Historical matches keep their frozen snapshots."))return;
 if(!await beforeDestructiveChange("Before profile deletion"))return;
 if(aid){r.ammo=r.ammo.filter(x=>x.id!==aid);if(!r.ammo.length)st.data.rifles=st.data.rifles.filter(x=>x.id!==rid)}
 else st.data.rifles=st.data.rifles.filter(x=>x.id!==rid);
 writeNow();render();
});}
function rifles(){
 setBottom(false);const combos=profileCombos();
 main.innerHTML=`<div class="panel"><div class="cardhead"><div><div class="kicker">Rifle + ammo combos</div><h2>Profiles</h2></div><button class="btn" id="addCombo">+ NEW COMBO</button></div>
 ${combos.length?combos.map(({r,a,incomplete})=>`<div class="comboCard" data-r="${esc(r.id)}" data-a="${esc(a?.id||"")}"><div class="comboTitle">${esc(r.name)}${a?` + ${esc(a.name)}`:" • SETUP INCOMPLETE"}</div><div class="comboMeta">${esc(r.cartridge||"")}${a?` • ${esc(a.bullet||"")} • ${esc(a.mv||"—")} ${esc(a.mvUnit||"fps")} • ${esc(a.bcType||"G7")} ${esc(a.bcValue||a.bc||"—")}<br>${a.currentCalibrationVersion?`Calibration v${esc(a.currentCalibrationVersion)} ✓`:`Calibration incomplete`}`:` • Add ammunition to complete this combo`}</div><div class="actions"><button class="btn secondary small editCombo">RIFLE / AMMO</button>${a?`<button class="btn outline small editWindSpeed">WIND SPEED</button><button class="btn outline small editWindAngle">WIND ANGLE</button><button class="btn outline small editTargetDof">TARGET DOF</button>`:""}<button class="btn danger small deleteCombo">DELETE PROFILE</button></div></div>`).join(""):`<div class="note">No rifle + ammo combos yet.</div>`}</div>`;
 addCombo.onclick=()=>{st.screen="rifleWizard";st.step=0;st.selectedRifle=null;st.selectedAmmo=null;render()};
 document.querySelectorAll(".comboCard").forEach(el=>{
   const openProfileStep=(step)=>{st.selectedRifle=el.dataset.r;st.selectedAmmo=(el.dataset.a&&el.dataset.a!=="undefined")?el.dataset.a:null;st.step=step;st.screen="rifleWizard";render()};
   el.querySelector(".editCombo").onclick=()=>openProfileStep(0);
   el.querySelector(".editWindSpeed")?.addEventListener("click",()=>openProfileStep(2));
   el.querySelector(".editWindAngle")?.addEventListener("click",()=>openProfileStep(3));
   el.querySelector(".editTargetDof")?.addEventListener("click",()=>openProfileStep(4));
   el.querySelector(".deleteCombo").onclick=()=>deleteCombo(el.dataset.r,el.dataset.a||null);
 });
}


function normalizeProfileData(r){
 if(!r)return r;
 r.name=r.name||"";r.cartridge=r.cartridge||"";
 r.twistValue=String(r.twistValue||r.twist||"").replace(/^1\s*:\s*/,"");
 r.twist=r.twistValue?`1:${r.twistValue}`:"";
 r.zeroM=r.zeroM||"100";r.sightHeight=r.sightHeight||"";r.sightHeightUnit=r.sightHeightUnit||"cm";
 r.kestrelModel=r.kestrelModel||"Kestrel / Applied Ballistics";r.notes=r.notes||"";r.ammo=r.ammo||[];
 r.ammo.forEach(a=>{
   a.name=a.name||"";a.bullet=a.bullet||"";a.weightGr=a.weightGr||"";a.mv=a.mv||"";a.mvUnit=a.mvUnit||"fps";a.mvSd=a.mvSd||"";a.precision=a.precision||"";a.precisionUnit=a.precisionUnit||"MOA";a.hPrecision=a.hPrecision||"";a.vPrecision=a.vPrecision||"";a.trajectorySensitivity=a.trajectorySensitivity||[];a.solverSens=a.solverSens||{windPer100m:"",elevPer10m:"",windPer10fps:"",elevPer10fps:"",elevPer100mDA:""};
   a.bcType=a.bcType||"G7";a.bcValue=a.bcValue||a.bc||"";a.bc=a.bcValue;a.lot=a.lot||"";a.notes=a.notes||"";
   a.currentCalibrationVersion=a.currentCalibrationVersion||0;a.calibrationVersions=a.calibrationVersions||[];
   loadAmmoWork(a);
 });
 return r;
}
function twistInputValue(r){
 return String(r?.twistValue||r?.twist||"").replace(/^1\s*:\s*/,"");
}
function loadAmmoWork(a){
 if(!a)return;
 const last=a.calibrationVersions?.[a.calibrationVersions.length-1];
 const hasCurrent=!!(a._work&&((a._work.A?.length||0)>0||(a._work.B?.length||0)>0||(a._work.D?.length||0)>0));
 if(!a._work?.initialized&&!hasCurrent&&last?.data)a._work=JSON.parse(JSON.stringify(last.data));
 if(!a._work)a._work={A:[],B:[],D:[]};
 a._work.A=a._work.A||[];a._work.B=a._work.B||[];a._work.D=a._work.D||[];
 a._work.meta=a._work.meta||{};a._work.sides=a._work.sides||{A:{},B:{},D:{}};
 a._work.sides.A=a._work.sides.A||{};a._work.sides.B=a._work.sides.B||{};a._work.sides.D=a._work.sides.D||{};
 a._work.meta.A={speeds:[5,10,15],...(a._work.meta.A||{})};if(a._work.meta.A.speeds==null)a._work.meta.A.speeds=[5,10,15];
 a._work.meta.B={speed:10,distances:[500,900],...(a._work.meta.B||{})};if(a._work.meta.B.distances==null)a._work.meta.B.distances=[500,900];
 a._work.meta.D={distance:700,stageWindFrom:90,ws1:8,ws2:12,...(a._work.meta.D||{})};
 if(!a._work.initialized&&!a._work.A.length)a._work.A=[300,400,500,600,700,800,900].map(d=>[d,...a._work.meta.A.speeds.map(()=>"")]);
 if(!a._work.initialized&&!a._work.B.length)a._work.B=[15,30,45,60,75,90].map(x=>[x,...a._work.meta.B.distances.map(()=>"")]);
 if(!a._work.initialized&&!a._work.D.length)a._work.D=[0,30,60,120,180,240,330].map(x=>[x,"","",""]);
 a._work.initialized=true;
}
function currentWizardAmmo(){
 const r=st.selectedRifle?st.data.rifles.find(x=>x.id===st.selectedRifle):st._rd;
 if(st.selectedAmmo)return r?.ammo?.find(x=>x.id===st.selectedAmmo)||r?.ammo?.[0]||null;
 return st._ad||r?.ammo?.[0]||null;
}
function canJumpProfileStep(step,r,a){
 if(step===0)return true;
 if(!r?.name)return false;
 if(step===1)return true;
 return !!a;
}
function navigateProfileStep(step){
 const r=window.__rwR,a=window.__rwA;
 saveRifleWizard(r,a);
 if(!profileEditValid(a,true))return;
 if(!canJumpProfileStep(step,r,a)){alert("Complete Rifle and Ammunition setup first.");return;}
 st.step=step;render();
}
function maybeVersionCalibration(a){
 if(!a||!calibrationComplete(a))return;
 const data=JSON.parse(JSON.stringify(a._work));
 const prev=a.calibrationVersions?.[a.calibrationVersions.length-1];
 if(!prev||JSON.stringify(prev.data)!==JSON.stringify(data)){
   a.currentCalibrationVersion=(a.currentCalibrationVersion||0)+1;
   a.calibrationVersions=a.calibrationVersions||[];
   a.calibrationVersions.push({version:a.currentCalibrationVersion,createdAt:iso(),data});
 }
}
function profileSaveAndExit(){
 const r=window.__rwR,a=window.__rwA;
 saveRifleWizard(r,a);
 if(!profileEditValid(a,true))return;
 if(!r?.name){alert("Enter a rifle name before saving.");return;}
 if(a?.name&&!r.ammo.find(x=>x.id===a.id))r.ammo.push(a);
 if(a)maybeVersionCalibration(a);
 const ix=st.data.rifles.findIndex(x=>x.id===r.id);if(ix>=0)st.data.rifles[ix]=r;else st.data.rifles.push(r);
 st._rd=null;st._ad=null;clearDraft("rifle");clearDraft("ammo");writeNow();
 st.screen="rifles";st.step=0;render();
}
function autoValidateCalibrationStep(a,key){
 if(!a)return true;
 const warnings=calWarnings(a,key);
 if(!warnings.length)return true;
 return confirm("WIND SIGHT found entries that may need checking:\n\n• "+warnings.join("\n• ")+"\n\nOK = continue anyway. Cancel = remain here and check.");
}
function calPartComplete(a,key){
 if(!a)return false;loadAmmoWork(a);
 const rows=a._work[key]||[];
 return rows.length>0&&rows.every(r=>r.slice(1).every(x=>n(x)!==null));
}

function rifleWizard(){
 const steps=["RIFLE","AMMO","WIND SPEED","WIND ANGLE","TARGET DOF","REVIEW"],last=5;
 setBottom(true,st.step===last?"FINISH / SAVE":"NEXT →");

 let r=st.selectedRifle?normalizeProfileData(st.data.rifles.find(x=>x.id===st.selectedRifle)):(st._rd||loadDraft("rifle")||(st._rd={
   id:uid("r"),name:"",cartridge:"",twistValue:"",twist:"",zeroM:"100",sightHeight:"",sightHeightUnit:"cm",kestrelModel:"Kestrel / Applied Ballistics",notes:"",ammo:[]
 }));
 if(!st.selectedRifle)st._rd=r;
 let a=null;
 if(st.step>=1 || st.selectedAmmo){
   a=st.selectedAmmo?r?.ammo.find(x=>x.id===st.selectedAmmo):(st._ad||loadDraft("ammo")||(st._ad={
     id:uid("a"),name:"",bullet:"",weightGr:"",mv:"",mvUnit:"fps",mvSd:"",precision:"",precisionUnit:"MOA",hPrecision:"",vPrecision:"",trajectorySensitivity:[],solverSens:{windPer100m:"",elevPer10m:"",windPer10fps:"",elevPer10fps:"",elevPer100mDA:""},bcType:"G7",bcValue:"",bc:"",lot:"",notes:"",currentCalibrationVersion:0,calibrationVersions:[],_work:{A:[],B:[],D:[]}
   }));
   if(!a && r?.ammo?.length){a=r.ammo[0];st.selectedAmmo=a.id;}
   if(a&&!st.selectedAmmo)st._ad=a;
   if(a&&r){const ai=r.ammo.findIndex(x=>x.id===a.id);if(ai>=0)r.ammo[ai]=a;}
   loadAmmoWork(a);
 }
 window.__rwR=r;window.__rwA=a;
 if(st.selectedRifle&&r&&canMutateData()){const ix=st.data.rifles.findIndex(x=>x.id===r.id);if(ix>=0)st.data.rifles[ix]=r;writeLocalFast();}

 const nav=steps.map((x,i)=>`<button type="button" class="step ${st.step===i?"active":""}" ${canJumpProfileStep(i,r,a)?"":'disabled'} onclick="navigateProfileStep(${i})">${x}</button>`).join("");
 if(!r){main.innerHTML=`<div class="panel"><div class="bad">Profile could not be loaded. Return to Profiles and try again.</div></div>`;setBottom(true,"BACK",false);backBtn.onclick=()=>{st.screen="rifles";render()};return;}
 main.innerHTML=`<div class="panel"><div class="kicker">Profile setup</div><h2 class="wizardTitle">${["Rifle Setup","Ammunition & Ballistics","Wind Speed Calibration","Wind Angle Calibration","Target DOF Validation","Review Combo"][st.step]}</h2>
 <div class="profileModuleNav">${nav}</div><div id="rw"></div></div>`;

 if(st.step===0){
   rw.innerHTML=`<div class="grid two">

   rows.forEach(r=>{

function kTargetHTML(t,i,fz){const ds=targetDirectionState(getStage(),t);return `<div class="card"><div class="cardhead"><strong>${esc(t.label)} • ${esc(t.distanceM)} m</strong><span class="tag ready">SOLVER</span></div><div class="hero"><div class="small">BALLISTIC INPUT / VERIFY</div><div style="font-size:24px;font-weight:1000;margin-top:8px">DOF ${String(Math.round(norm(n(t.dof)||0))).padStart(3,"0")}°</div><div class="small" style="margin-top:8px">WIND SIGHT FUSED TARGET WD</div><div style="font-size:32px;font-weight:1000;color:var(--blue)">${String(Math.round(ds.targetWD)).padStart(3,"0")}°</div><div class="small">${clock(ds.targetWD)} • SAME DIRECTION STATE USED BY ACCURACY ENGINE</div></div><div class="out3"><div class="obox"><div class="t">LOW WIND</div><div class="n">${fz.low.toFixed(0)}</div><div class="unit">mph</div></div><div class="obox best"><div class="t">BEST WIND</div><div class="n">${fz.best.toFixed(0)}</div><div class="unit">mph</div></div><div class="obox"><div class="t">HIGH WIND</div><div class="n">${fz.high.toFixed(0)}</div><div class="unit">mph</div></div></div><div class="grid two">${f("Solver MIN hold","kmin_"+i,inputFieldValue(t,"kMin"),"decimal")}${f("Solver MAX hold","kmax_"+i,inputFieldValue(t,"kMax"),"decimal")}</div><div class="note">Enter solver holds using the FUSED Target WD shown above. WIND SIGHT treats these holds as already angle-corrected and does not apply the angle a second time.</div>${n(t.kMin)!==null&&n(t.kMax)!==null?callCurveHTML(getStage(),t):""}</div>`}
function fuse(s){
 let mi=n(s.wind.min),av=n(s.wind.avg),ma=n(s.wind.max),dir=n(s.wind.avgDir);
 if(mi===null||av===null||ma===null||dir===null||mi<0||av<0||ma<0||!(mi<=av&&av<=ma)||!angleOK(dir))return {valid:false,reason:"Enter valid non-negative manual MIN / AVG / MAX and AVG WIND FROM.",quality:"WEAK"};
 if(s.targets.some(t=>String(t.dof??"").trim()===""||n(t.dof)===null))return {valid:false,reason:"Enter a DOF for every target before continuing to Kestrel.",quality:"WEAK"};
 let low=mi,best=av,high=ma,conflicts=[],speedObs=[],dirObs=[],pathNotes=[];
 const zones=[...s.points.map((p,idx)=>({name:`Point ${idx+1}`,terrain:p.terrain,obs:p.obs})),{name:"Target zone",terrain:s.targetTerrain,obs:s.targetObs}];
 zones.forEach(z=>{
   const zr=[];
   (z.obs||[]).forEach(o=>{
     if(!observationActive(o))return;
     const b=behavior[o.indicator]?.[+o.behavior||0]; if(!b)return;
     const rr=rel(o.indicator);
     if(b[1]!=null)zr.push({lo:b[1],hi:b[2],mid:(b[1]+b[2])/2,rel:rr,source:o.indicator,zone:z.name});
     if(o.quality!=="Unknown"&&String(o.dir??"").trim()!==""){
       const dr=b[3].includes("direction")?Math.max(rr,.8):rr;
       dirObs.push({deg:norm((+o.dir)+180),rel:dr*(o.quality==="Clear"?1:.55),zone:z.name});
     }
   });
   if(zr.length>1){const il=Math.max(...zr.map(x=>x.lo)),ih=Math.min(...zr.map(x=>x.hi));if(il>ih)conflicts.push(`${z.name}: observations disagree.`)}
   if(zr.length){const zl=Math.min(...zr.map(x=>x.lo)),zh=Math.max(...zr.map(x=>x.hi));if(zh<mi)pathNotes.push(`${z.name}: observed wind appears weaker than shooter bracket.`);if(zl>ma)pathNotes.push(`${z.name}: observed wind appears stronger than shooter bracket.`)}speedObs.push(...zr);
 });
 let sw=3,sm=3*av;speedObs.forEach(e=>{sw+=e.rel;sm+=e.rel*e.mid});best=Math.max(low,Math.min(high,sm/sw));
 const nowSp=n(s.wind.now); if(nowSp!==null&&nowSp>=low&&nowSp<=high)best=Math.max(low,Math.min(high,best*.7+nowSp*.3));
 let vx=3*Math.cos(dir*Math.PI/180),vy=3*Math.sin(dir*Math.PI/180);
 dirObs.forEach(e=>{vx+=e.rel*Math.cos(e.deg*Math.PI/180);vy+=e.rel*Math.sin(e.deg*Math.PI/180)});
 const nowDir=n(s.wind.nowDir);if(nowDir!==null&&Math.abs(sdelta(nowDir,dir))<=35){vx+=1.2*Math.cos(nowDir*Math.PI/180);vy+=1.2*Math.sin(nowDir*Math.PI/180)}
 const dBest=norm(Math.atan2(vy,vx)*180/Math.PI);
 const terrainSet=[s.wind.terrain||"Open / normal",...s.points.map(p=>p.terrain),s.targetTerrain||"Open / normal"];
 const terrainComplex=terrainSet.filter(x=>["Sheltered","Ridge / exposed","Valley / channel","Turbulent / complex","Unknown"].includes(x)).length;
 let q="STRONG"; if(conflicts.length||speedObs.length===0||terrainComplex>0)q="MODERATE"; if(conflicts.length>1||terrainComplex>2)q="WEAK";
 const learned=learnedBias(s);const directionSamples=[dir,...dirObs.map(x=>x.deg)];if(nowDir!==null&&angleOK(nowDir))directionSamples.push(norm(nowDir));
 return {valid:true,low,best,high,dir:dBest,quality:q,conflicts,pathNotes,learnedBias:learned,directionSamples}
}
function learnedBias(currentStage){
 let m=st.data.matches.find(x=>x.id===st.selectedMatch);if(!m)return null;let now=Date.now(),vals=[];
 (m.stages||[]).map(historicalStageView).filter(x=>x.completedAt&&x.id!==currentStage.id).forEach(s=>{
   const at=Date.parse(s.completedAt);if(!Number.isFinite(at))return;let ageH=Math.max(0,(now-at)/36e5),wt=Math.exp(-ageH/2);
   s.targets.forEach(t=>{let a=n(t.actualHold),lo=n(t.kMin),hi=n(t.kMax);if(a!==null&&lo!==null&&hi!==null&&hi>lo){let pos=(a-lo)/(hi-lo)-.5;vals.push({bias:pos,wt})}})
 });
 if(!vals.length)return null;let sw=vals.reduce((x,y)=>x+y.wt,0),b=vals.reduce((x,y)=>x+y.bias*y.wt,0)/sw;return Math.max(-.5,Math.min(.5,b))*.5
}
function tWind(t,f){let rel=sdelta(f.dir,+t.dof||0),factor=Math.abs(Math.sin(rel*Math.PI/180));return {expectedWD:norm(f.dir-(+t.dof||0)),rel,factor,low:f.low*factor,best:f.best*factor,high:f.high*factor}}


function hold1(x){const z=n(x);if(z===null)return "—";const a=Math.abs(z),r=Math.round((a+Number.EPSILON*Math.max(1,a))*10)/10;return (r===0?0:Math.sign(z)*r).toFixed(1)}

function robustHoldText(sol){const a=hold1(sol.robustMin),b=hold1(sol.robustMax),side=sol.robustSide||sol.side||"";return a===b?`${a} ${side}`:`${a}–${b} ${side}`}
function shootResultV2(tt,sol,fallback,z){
 if(sol?.sideAmbiguous)return `<div class="warn"><strong>${esc(tt.label)} • SIDE AMBIGUOUS</strong><br>${Math.round((sol.sideMinorProb||0)*100)}% of modeled wind correction lies on the opposite side. Re-check wind direction before shooting.</div>`;
 if(!fallback)return `<div class="note">${esc(tt.label)}: solver MIN/MAX holds and target width required.</div>`;
 if(!sol)return `<div class="shootCompact"><div class="shootTarget">${esc(tt.label)} • ${esc(tt.distanceM)} m</div><div class="shootHold">—<small>WIND SIGHT HOLD UNAVAILABLE</small></div><div class="note">Check WIND, solver MIN/MAX and calibration. Invalid inputs or a calculation outside the supported search limits do not produce a call.</div></div>`;
 const dims=targetDimsMil(tt),miss=suggestedMissCorrection(tt),confClass=sol.confidence==="HIGH"?"confHigh":sol.confidence==="MEDIUM"?"confMed":"confLow",lo=Math.min(n(tt.kMin)||0,n(tt.kMax)||0),hi=Math.max(n(tt.kMin)||0,n(tt.kMax)||0);
 const gongMain=dims ? (tt.shape==="Round"?`Ø${dims.w.toFixed(2)} mil`:(Math.abs(dims.w-dims.h)<0.005?`${dims.w.toFixed(2)} × ${dims.w.toFixed(2)} mil`:`${dims.w.toFixed(2)} × ${dims.h.toFixed(2)} mil`)) : "—";
 const gongSub=dims ? `${esc(tt.shape||"Target")} • ${targetSizeText(tt)} • Solver ${hold1(lo)}${sol.side}–${hold1(hi)}${sol.side}` : `Solver ${hold1(lo)}${sol.side}–${hold1(hi)}${sol.side}`;
 const missSub=dims ? `${dims.w.toFixed(1)} mil target width` : `Suggested correction from target width`;
 return `<div class="shootCompact"><div class="shootTop"><div><div class="shootTarget">${esc(tt.label)} • ${esc(tt.distanceM)} m</div><div class="shootMeta">${esc(tt.shape||"Target")} • ${esc(targetSizeText(tt))}</div></div><span class="tag done">CORE 5</span></div><div class="shootHold">${hold1(sol.hold)} ${sol.side}<small>WIND SIGHT HOLD</small></div><div class="wsHoldBand"><div><span>MIN</span><strong>${hold1(lo)} ${sol.side}</strong></div><div class="rec"><span>CALL</span><strong>${hold1(sol.hold)} ${sol.side}</strong></div><div><span>MAX</span><strong>${hold1(hi)} ${sol.side}</strong></div></div><div class="wsMetricGrid topMetrics"><div class="wsMetric"><div class="k">GONG</div><div class="v">${gongMain}</div><div class="sub">${gongSub}</div></div><div class="wsMetric"><div class="k">CORRECTION</div><div class="v">${miss!==null?`${hold1(miss)} mil`:"—"}</div><div class="sub">${missSub}</div></div></div><div class="wsMetricGrid"><div class="wsMetric primaryMetric"><div class="k">WIND HIT</div><div class="v">${Math.round(sol.windHit*100)}%</div><div class="impactSecondary">Est. impact ${Math.round(sol.modeledHit*100)}%</div></div><div class="wsMetric"><div class="k">CONFIDENCE</div><div class="v ${confClass}">${sol.confidence}</div><div class="sub">Model certainty for the current call</div></div></div></div>`;
}
function stageLineV2(tt,sol,fallback,z){
 if(sol?.sideAmbiguous)return `<div class="stageLine"><strong>${esc(tt.label)} • ${esc(tt.distanceM)} m</strong><div class="hold">SIDE?</div><div class="meta">Recheck wind direction</div></div>`;
 if(sol){
   const dims=targetDimsMil(tt),lo=Math.min(n(tt.kMin)||0,n(tt.kMax)||0),hi=Math.max(n(tt.kMin)||0,n(tt.kMax)||0);
   const gong=dims ? (tt.shape==="Round"?`Ø${dims.w.toFixed(2)} mil`:(Math.abs(dims.w-dims.h)<0.005?`${dims.w.toFixed(2)} × ${dims.w.toFixed(2)} mil`:`${dims.w.toFixed(2)} × ${dims.h.toFixed(2)} mil`)) : "size —";
   return `<div class="stageLine"><strong>${esc(tt.label)} • ${esc(tt.distanceM)} m</strong><div class="hold">${hold1(sol.hold)} ${sol.side}</div><div class="meta">${gong} • Solver ${hold1(lo)}${sol.side}–${hold1(hi)}${sol.side}</div></div>`;
 }
 return `<div class="stageLine"><strong>${esc(tt.label)}</strong><div class="hold">—</div><div class="meta">Solver holds required</div></div>`

function suggestedMissCorrection(tt){
 const dm=targetDimsMil(tt);
 if(!dm||!(dm.w>0))return null;
 return Number((dm.w*0.75).toFixed(1));
}

function targetDimsMil(tt){
 const d=n(tt.distanceM),w=n(tt.widthCm),h=n(tt.heightCm||tt.widthCm);
 if(!(d>0&&w>0))return null;
 return {w:(w/100)/d*1000,h:((h>0?h:w)/100)/d*1000};
}
function targetSizeText(tt){
 const dm=targetDimsMil(tt);if(!dm)return "Target size incomplete";
 const shape=tt.shape||"Target",w=n(tt.widthCm),h=n(tt.heightCm||tt.widthCm);
 if(shape==="Round")return `Ø${w} cm • Ø${dm.w.toFixed(2)} mil`;
 if(["Square","Diamond"].includes(shape))return `${w} × ${w} cm • ${dm.w.toFixed(2)} × ${dm.w.toFixed(2)} mil`;

 else if(suspiciousEmpty)blockStorage('An empty current save conflicts with an older populated copy. The populated copy is shown for review; nothing has been overwritten. Restore the correct copy under DATA.');
 else if(invalidPrimary)blockStorage('A current saved copy is invalid. Valid data is shown where available; nothing has been overwritten. Export recovery copies under DATA before restoring.');
 else if(!chosen&&(!localReadable||!idbReadable||protection.errors.length))blockStorage('Saved data could not be read reliably. No empty replacement has been written. Retry in the original browser and URL, or import a known backup under DATA.');
 else if(!idbReadable)blockStorage('The IndexedDB mirror could not be checked. Local data is shown read-only to avoid overwriting a potentially newer copy. Reload after closing other app tabs.');
 else if(!localReadable)blockStorage('The local save could not be checked. Database data is shown read-only. Export it under DATA and retry in the original browser.');
 if(chosen&&dataHasContent(st.data)&&!protection.blocked){const ok=await createRecoveryPoint('Before Competition Core 3.8.10',chosen.data,true);if(!ok)blockStorage('The pre-upgrade recovery copy could not be saved. Export your data under DATA before proceeding.');}
 protection.ready=true;
 if(protection.blocked)st.screen='dataProtection';
 render();storageStatus(protection.blocked?'RECOVERY REQUIRED':chosen?'Loaded ✓':'No saved data yet',protection.blocked);
 if(navigator.storage?.persisted){try{protection.persistent=await navigator.storage.persisted()}catch(e){}}
}
function serializeData(){
 if(!validBackupShape(st.data)||(st.data.schemaVersion||1)>SCHEMA_VERSION)throw new Error('Invalid or newer data structure; save blocked');
 const body=dataBody(st.data);
 if(body===protection.lastBody&&protection.raw)return protection.raw;
 st.data.lastSavedAt=iso();st.data._storageMeta={version:1,saveId:uid('save'),appVersion:APP_VERSION};
 const raw=JSON.stringify(st.data);protection.lastBody=body;protection.raw=raw;lastSerialized=raw;return raw;
}
function queueMirror(raw,sequence){
 const task=protection.queue.catch(()=>{}).then(async()=>{
  if(protection.blocked)return false;
  try{await idbPut(JSON.parse(raw));if(sequence===protection.sequence){protection.idbOK=true;protection.dirty=false;if(protection.localOK&&/^(Database mirror failed|Local save failed|Both saves failed)/.test(protection.warning))protection.warning='';storageStatus(protection.localOK?'Saved ✓ · 2 copies':'Saved ✓ · database only');}return true}
  catch(e){if(sequence===protection.sequence){protection.idbOK=false;if(!protection.blocked){protection.warning=protection.localOK?'Database mirror failed. A local copy is saved; export a backup.':'Both saves failed. Keep this app open and export a backup now.';storageStatus(protection.localOK?'SAVED · 1 COPY':'SAVE FAILED',!protection.localOK)}}return false}
 });protection.queue=task;return task;
}
function writeLocalFast(schedule=true){
 if(!protection.ready||protection.blocked)return false;
 clearTimeout(saveTimer);clearTimeout(idbSaveTimer);
 let raw;try{raw=serializeData()}catch(e){blockStorage(e.message);return false}
 const sequence=++protection.sequence;protection.localOK=false;protection.idbOK=false;
 try{
  const previous=localStorage.getItem(DBKEY);
  if(previous!==protection.expectedLocal&&previous!==raw){blockStorage('Another tab changed the local save. Export this tab before closing it; reopen only one app tab.',true);return false}
  if(previous&&previous!==raw&&Date.now()-protection.lastGoodAt>=60000){
   const p=parseCandidate(previous,'Previous local save');
   if(p&&!p.future&&dataHasContent(p.data)){try{localStorage.setItem(RECOVERY_KEY,JSON.stringify(recoveryEntry(p.data,'Automatic previous local save')));protection.lastGoodAt=Date.now()}catch(e){protection.warning='Local recovery-copy storage is full. Export a JSON backup.'}}
  }
  localStorage.setItem(DBKEY,raw);protection.localOK=localStorage.getItem(DBKEY)===raw;
  if(protection.localOK)protection.expectedLocal=raw;
 }catch(e){protection.warning='Local save failed; trying the database mirror. Keep the app open until saved or export a backup.'}
 protection.dirty=true;storageStatus(protection.localOK?'Saved locally · checking mirror':'Saving to database…');
 if(schedule)idbSaveTimer=setTimeout(()=>{idbSaveTimer=null;queueMirror(raw,sequence)},300);
 return protection.localOK;
}
async function writeNow(){
 if(!protection.ready||protection.blocked)return false;
 const localOK=writeLocalFast(false);if(protection.blocked)return false;
 const idbOK=await queueMirror(protection.raw,protection.sequence);return localOK||idbOK;
}
function autosave(){
 if(!protection.ready||protection.blocked)return;
 if(!protection.dirty&&dataBody(st.data)===protection.lastBody)return;
 protection.dirty=true;storageStatus('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(writeLocalFast,120);
}
function flushProtectedData(){if(!protection.ready||protection.blocked)return;writeLocalFast(false);queueMirror(protection.raw,protection.sequence)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushProtectedData()});
window.addEventListener('pagehide',flushProtectedData);
window.addEventListener('storage',e=>{if(protection.ready&&e.key===DBKEY&&e.newValue!==protection.expectedLocal)blockStorage('Data changed in another tab. Export any unsaved work from this tab, then close it and use a single app tab.',true)});
window.addEventListener('beforeunload',e=>{if(protection.dirty&&!protection.localOK){e.preventDefault();e.returnValue=''}});

function downloadRawJSON(raw,filename){
 const a=document.createElement("a"),url=URL.createObjectURL(new Blob([raw],{type:"application/json"}));
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function downloadJSON(data,filename){
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function exportData(){
 if(!protection.ready)return;
 if(!protection.blocked)saveCurrent();
 const d=JSON.parse(JSON.stringify(st.data));d._backup={app:'WIND SIGHT PRS',appVersion:APP_VERSION,exportedAt:iso(),origin:location.origin};
 const error=backupShapeError(d)||importedNumericError(d);
 if(error){downloadRawJSON(JSON.stringify(d,null,2),`WIND_SIGHT_REJECTED_REVIEW_ONLY_${Date.now()}.json`);protection.notice='Original data exported for investigation only; it failed backup validation: '+error;storageStatus(saveState.textContent);return;}
 downloadJSON(d,`WIND_SIGHT_PRS_backup_${new Date().toISOString().replace(/[:.]/g,'-')}.json`);
 protection.notice='Backup download requested. Confirm the JSON file is in Files / Downloads before changing browser, URL or device.';storageStatus(saveState.textContent);
}
async function replaceWithBackup(parsed,reason='Before backup import',ask=true){return runProtectedChange(()=>replaceBackupCore(parsed,reason,ask))}
async function replaceBackupCore(parsed,reason='Before backup import',ask=true){
 const shapeError=backupShapeError(parsed);if(shapeError)throw new Error('Backup rejected: '+shapeError);
 const numberError=importedNumericError(parsed);if(numberError)throw new Error('Backup rejected: '+numberError);
 if((parsed.schemaVersion||1)>SCHEMA_VERSION)throw new Error('This backup uses a newer schema. Use its matching app version.');
 if(protection.conflict)throw new Error('Another tab has changed the data. Export this tab, close other tabs, and reload before importing.');
 if(protection.candidates.some(c=>c.future))throw new Error('A newer-schema saved copy exists. This build will not overwrite it.');
 if(ask&&!confirm(`Replace current data with this backup?\n\nCURRENT: ${countsText(st.data)}\nBACKUP: ${countsText(parsed)}\n\nA recovery copy will be saved before replacement. This is a full replacement, not a merge.`))return false;
 clearTimeout(saveTimer);clearTimeout(idbSaveTimer);await protection.queue;
 const token=changeBoundaryToken();
 if(!await verifyChangeBoundary(token,true))throw new Error("Saved data changed or could not be verified. Import cancelled.");
 // Preserve the working state AND each readable stored primary before a replacement.
 const before=JSON.parse(JSON.stringify(st.data));
 const sources=await collectRecoveryCandidates(false);
 for(const c of sources.candidates.filter(x=>x.kind==='primary'&&!x.future)){if(dataBody(c.data)!==dataBody(before)&&!await createRecoveryPoint(reason+' · '+c.source,c.data))throw new Error('Could not preserve an existing saved copy. Import cancelled.');}
 if(!await createRecoveryPoint(reason,before))throw new Error('Recovery copy failed. Existing data has not been replaced.');
 if(!await verifyChangeBoundary(token,true))throw new Error("Data changed while saving recovery copies. Import cancelled.");
 // Quarantine unreadable raw primary bytes before allowing their replacement.
 try{const raw=localStorage.getItem(DBKEY);if(raw&&!parseCandidate(raw,'Local replacement check')){localStorage.setItem('windSightPRS.quarantine',raw);if(localStorage.getItem('windSightPRS.quarantine')!==raw)throw new Error('Cannot preserve invalid local data');}protection.expectedLocal=raw;}catch(e){throw new Error('Could not preserve/read local data. Import cancelled: '+e.message)}
 try{const d=await idbGet();if(d&&!parseCandidate(d,'Database replacement check')){await stateTransaction('readwrite',(store,set)=>{store.put(d,'quarantine.v1');set(true)})}protection.expectedIDB=d?JSON.stringify(d):null;}catch(e){throw new Error('Could not preserve/read database data. Import cancelled: '+e.message)}
 if(!await verifyChangeBoundary(token,true))throw new Error("Data changed before replacement. Import cancelled.");
 const incoming=migrateData(JSON.parse(JSON.stringify(parsed)));delete incoming._backup;
 protection.blocked=false;protection.warning='';protection.notice='';protection.lastBody='';protection.raw='';st.data=incoming;
 st.selectedRifle=null;st.selectedAmmo=null;st.selectedMatch=null;st.selectedStage=null;st._rd=null;st._ad=null;st._md=null;st.step=0;st.liveStep=0;
 const saved=await writeNow();
 if(!saved){st.data=before;protection.lastBody='';protection.raw='';blockStorage('Replacement could not be saved. The previous data is shown; export it and the original backup file before retrying.');render();throw new Error('Replacement save failed. Recovery copy retained.');}
 protection.notice=`Backup restored. ${countsText(st.data)}. Previous data remains in recovery copies.`;st.screen='dataProtection';render();storageStatus(protection.localOK&&protection.idbOK?'Restored ✓ · 2 copies':'Restored ✓ · 1 copy');return true;
}
function importData(e){
 const input=e.target,file=input.files?.[0];if(!file)return;
 if(file.size>25*1024*1024){alert('Backup exceeds the 25 MB import limit. Nothing was changed.');input.value='';return}
 const rd=new FileReader();rd.onerror=()=>{alert('Could not read this file. Nothing was changed.');input.value=''};
 rd.onload=async()=>{try{const parsed=JSON.parse(rd.result);await replaceWithBackup(parsed)}catch(err){alert(err.message||'Invalid backup; nothing was imported.')}finally{input.value=''}};rd.readAsText(file);
}
async function beforeDestructiveChange(reason){
 if(protection.blocked){alert(protection.warning||'Resolve the storage issue under DATA first.');return false;}
 clearTimeout(saveTimer);clearTimeout(idbSaveTimer);await protection.queue;
 if(protection.blocked)return false;
 const token=changeBoundaryToken();
 if(!await verifyChangeBoundary(token))return false;
 const ok=await createRecoveryPoint(reason);
 if(!ok){alert('Recovery copy could not be saved. Deletion cancelled. Export your data under DATA.');return false;}
 return await verifyChangeBoundary(token);
}
function changeBoundaryToken(){return {epoch:protection.guardEpoch||0,data:st.data,body:dataBody(st.data),local:protection.expectedLocal,idb:protection.expectedIDB};}
async function verifyChangeBoundary(token,allowBlocked=false){
 const unchanged=()=>token.epoch===(protection.guardEpoch||0)&&token.data===st.data&&token.body===dataBody(st.data)&&!protection.conflict&&(allowBlocked||!protection.blocked);
 if(!unchanged())return false;
 try{
  if(localStorage.getItem(DBKEY)!==token.local){blockStorage('Another tab changed data during the operation. Nothing further was changed. Export this tab and reload a single app tab.',true);return false;}
  const d=await idbGet(),raw=d?JSON.stringify(d):null;
  if(!unchanged())return false;
  if(raw!==token.idb||localStorage.getItem(DBKEY)!==token.local){blockStorage('Another saved copy changed during the operation. The operation was cancelled.',true);return false;}
 }catch(e){protection.warning='Saved data could not be rechecked; the operation was cancelled. Export a backup.';storageStatus('CHANGE CANCELLED',true);return false;}
 return unchanged();
}
function dataProtection(){
 setBottom(false);
 main.innerHTML=`<div class="panel"><div class="kicker">Local data safety · v${APP_VERSION}</div><h2>Data Protection & Recovery</h2><p class="sub">${countsText(st.data)}</p><div class="${protection.blocked?'bad':'note'}">${esc(protection.warning||protection.notice||'Data stays in this browser and website. Export a JSON backup before an update or competition.')}</div><div class="grid two"><div><div class="small">LOCAL SAVE</div><strong id="dpLocal">${protection.localOK?'Current copy verified':'Not verified / not current'}</strong></div><div><div class="small">DATABASE MIRROR</div><strong id="dpMirror">${protection.idbOK?'Current copy verified':'Not verified / not current'}</strong></div></div><div class="note"><strong>Current website:</strong> <span style="overflow-wrap:anywhere">${esc(location.origin)}</span><br><strong>Last data save:</strong> <span id="dpSavedAt">${esc(st.data.lastSavedAt?new Date(st.data.lastSavedAt).toLocaleString():'Not yet saved')}</span><br>Recovery copies on this device are not an external backup. Clearing website data, changing browser or changing hostname can make them unavailable.</div><div class="actions"><button class="btn" id="exportProtected">EXPORT FULL BACKUP</button><button class="btn secondary" id="importProtected">IMPORT BACKUP</button><button class="btn outline" id="checkpointProtected">SAVE RECOVERY POINT</button></div><input id="protectedFile" class="hidden" type="file" accept=".json,application/json"><div class="actions"><button class="btn outline small" id="persistProtected">REQUEST PERSISTENT STORAGE</button><button class="btn outline small" id="reloadProtected">RECHECK SAVED DATA</button></div><div class="small" id="persistResult" style="margin-top:10px">Persistent storage: ${protection.persistent===true?'granted':protection.persistent===false?'not granted':'not checked / unsupported'}. The browser decides; this does not replace an exported backup.</div></div><div class="panel"><h3>Available recovery copies</h3><p class="sub">Review counts and dates before restoring. Restore replaces the complete working dataset.</p><div id="recoveryCopies">Loading recovery copies…</div></div>`;
 exportProtected.onclick=exportData;importProtected.onclick=()=>protectedFile.click();protectedFile.onchange=importData;
 checkpointProtected.onclick=async()=>{if(protection.blocked){alert('Export available data before resolving the storage issue.');return}checkpointProtected.disabled=true;try{if(await createRecoveryPoint()){protection.notice='Recovery point saved on this device.';await refreshRecoveryList()}}finally{checkpointProtected.disabled=false}};
 reloadProtected.onclick=()=>{if(confirm('Export any unsaved work first. Reload now to recheck saved data?'))location.reload()};
 persistProtected.onclick=async()=>{try{if(typeof navigator.storage?.persist!=='function'){persistResult.textContent='Persistent storage requests are not supported in this browser. Export backups regularly.';return}protection.persistent=await navigator.storage.persist();persistResult.textContent=protection.persistent?'Persistent storage granted. Keep external JSON backups as well.':'Persistent storage not granted by this browser. Export backups regularly.'}catch(e){persistResult.textContent='Persistent storage request failed. Export backups regularly.'}};
 refreshRecoveryList();
}
async function refreshRecoveryList(){
 const host=document.getElementById('recoveryCopies');if(!host)return;
 // Reading the recovery list must not change the expected concurrency fingerprints.
 const result=await collectRecoveryCandidates(false);
 const seen=new Set(),items=result.candidates.filter(c=>{const sig=c.raw;if(seen.has(sig))return false;seen.add(sig);return true}).sort((a,b)=>b.ts-a.ts);
 if(!document.contains(host))return;
 host.innerHTML=items.length?items.map((c,i)=>`<div class="card"><strong>${esc(c.source)}</strong><div class="small">${esc(c.at?new Date(c.at).toLocaleString():'Date unavailable')}<br>${countsText(c.data)}${c.future?' · newer schema':''}</div><div class="actions"><button class="btn outline small" data-recovery-export="${i}">EXPORT COPY</button><button class="btn secondary small" data-recovery-restore="${i}" ${c.future?'disabled':''}>RESTORE COPY</button></div></div>`).join(''):'<div class="note">No saved copies found at this browser and URL. Import an exported JSON backup from the original app.</div>';
 const rejected=protection.invalidCandidates||[];
 if(rejected.length)host.insertAdjacentHTML("beforeend",`<div class="bad">REJECTED COPIES — export original bytes for investigation. These are not verified restorable backups and cannot be restored here.</div>`+rejected.map((c,i)=>`<div class="card"><strong>${esc(c.source)}</strong><div class="small">${esc(c.error)}</div><button class="btn outline small" data-invalid-export="${i}">EXPORT ORIGINAL REJECTED COPY</button></div>`).join(""));
 host.querySelectorAll("[data-invalid-export]").forEach(b=>b.onclick=()=>downloadRawJSON(rejected[+b.dataset.invalidExport].raw,`WIND_SIGHT_REJECTED_REVIEW_ONLY_${Date.now()}.json`));
 host.querySelectorAll('[data-recovery-export]').forEach(b=>b.onclick=()=>downloadJSON(items[+b.dataset.recoveryExport].data,`WIND_SIGHT_recovery_${Date.now()}.json`));
 host.querySelectorAll('[data-recovery-restore]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await replaceWithBackup(items[+b.dataset.recoveryRestore].data,'Before recovery restore')}catch(e){alert(e.message)}finally{b.disabled=false}});
}

// Read-only means read-only: failed startup recovery must not accept hidden unsaved edits.
for(const type of ['click','keydown','beforeinput','input','change','paste','drop','compositionstart'])document.addEventListener(type,e=>{
 const inData=st.screen==='dataProtection'&&main.contains?.(e.target);
 const blocked=protection.ready&&protection.blocked&&!inData&&(main.contains?.(e.target)||bottom.contains?.(e.target)||overlay.contains?.(e.target));
 if(protection.operation||blocked){e.preventDefault();e.stopImmediatePropagation();}
},true);

async function runProtectedChange(action){
 if(protection.operation){alert('A protected data change is already in progress. Please wait.');return false;}
 protection.operation=true;applyProtectionUI();
 try{return await action();}finally{protection.operation=false;applyProtectionUI();}
}
document.addEventListener('click',e=>{if(protection.operation){e.preventDefault();e.stopImmediatePropagation()}},true);

if("serviceWorker" in navigator){window.addEventListener("load",async()=>{
 try{const reg=await navigator.serviceWorker.register("./service-worker.js",{updateViaCache:"none"});
 const showUpdate=()=>{if(reg.waiting&&navigator.serviceWorker.controller){const el=document.getElementById('updateNotice');el.hidden=false;el.textContent='An app update is ready. Export your data, then close all WIND SIGHT tabs and reopen. No automatic reload will interrupt your stage.'}};
 showUpdate();reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',showUpdate)});
 }catch(e){protection.warning='Offline installation failed. Keep a JSON backup and check connectivity before competition.';storageStatus(saveState.textContent)}
});}
initializeProtectedData().catch(e=>{protection.ready=true;blockStorage("Startup check failed: "+e.message);st.screen="dataProtection";render()});
</script>
</body>
</html>
