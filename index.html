<style>
:root{
  --bg:#07111d;--panel:#0d1a28;--panel2:#091522;--ink:#f7f9fc;--muted:#8ea0b4;--line:#223449;
  --good:#38b979;--warn:#d7a93b;--bad:#e05c58;--blue:#009abf;--blue2:#007a98;
  --silver:#d9dee7;--ztBase:#6f7271;--ztTonal:#98989a;--ztAccent:#d0cfcd;--r:18px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#10253a 0,#07111d 38%,#040a11 100%);color:var(--ink);overscroll-behavior-y:none}
body.modal-open{overflow:hidden;touch-action:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:860px;margin:auto;min-height:100vh;padding-bottom:94px}
header{position:sticky;top:0;z-index:50;background:rgba(4,10,17,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:20px;font-weight:1000;letter-spacing:.05em;color:var(--silver)}
.brand small{display:block;font-size:9px;letter-spacing:.16em;color:#6f8194;margin-top:2px}
.save{font-size:12px;color:var(--muted);font-weight:800}
nav{display:flex;gap:6px;overflow:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.navbtn{white-space:nowrap;border:1px solid var(--line);background:#0a1521;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;color:#98a8b9}
.navbtn.active{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;border-color:var(--blue)}
main{padding:14px}
.panel{background:linear-gradient(180deg,#0e1c2b,#0a1622);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.20)}
.kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:1000}
h2,h3{margin:0}h2{font-size:26px;margin-top:4px}h3{font-size:18px}
.sub{color:var(--muted);line-height:1.45;margin:7px 0 0}
.grid{display:grid;gap:11px;margin-top:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:650px){.two,.three,.four{grid-template-columns:1fr 1fr}.fullMobile{grid-column:1/-1}}
@media(max-width:420px){.three,.four{grid-template-columns:1fr 1fr}}
label{display:block;font-size:11px;font-weight:1000;letter-spacing:.05em;color:#9eafc1;text-transform:uppercase}
input,select,textarea{width:100%;margin-top:6px;border:1px solid #2a3d52;border-radius:13px;background:#08131f;color:#f7f9fc;padding:12px;min-height:48px;outline:none;font-size:16px}
input[type=text],input[type=number]{font-size:19px;font-weight:850}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,154,191,.18)}
.btn{border:0;border-radius:13px;background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;padding:12px 14px;min-height:46px;font-weight:950}
.btn.secondary{background:#122235;color:#e5edf7;border:1px solid #263a50}
.btn.outline{background:#08131f;color:#dbe7f4;border:1px solid var(--line)}
.btn.small{min-height:38px;padding:8px 10px;font-size:13px}
.btn.danger{background:#2a1114;color:#ff8c8c;border:1px solid #5d252b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card{border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:10px;background:#0a1724}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:1000;letter-spacing:.05em}
.ready{background:#16283a;color:#9db0c3}.live{background:#2b2511;color:#f2c75b}.done{background:#10281d;color:#70d69d}
.note,.warn,.bad{border-radius:12px;padding:10px 11px;margin-top:10px;font-size:12px;line-height:1.4}
.note{background:#0a1724;border:1px solid #223449;color:#9eafc1}.warn{background:#2a2110;border:1px solid #5d4921;color:#efc35f}.bad{background:#2a1114;border:1px solid #5d252b;color:#ff8c8c}
.listrow{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #17283a;padding:11px 0}.listrow:first-child{border-top:0}
.small{font-size:12px;color:var(--muted)}
.metric{font-size:31px;font-weight:1000;line-height:1}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(4,10,17,.96);border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom))}
.bottomin{max-width:860px;margin:auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.bigbtn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:#0a1521;color:#dce7f2;font-weight:950}.bigbtn.primary{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;border-color:var(--blue)}
.stepbar{display:flex;gap:6px;overflow:auto;margin-top:12px}.step{border:1px solid var(--line);background:#0a1521;color:#92a4b7;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;white-space:nowrap}.step.active{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff}
.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.tab{border:1px solid var(--line);background:#0a1521;color:#9fb0c2;border-radius:11px;padding:9px 12px;font-weight:950}.tab.active{background:var(--blue2);color:#fff}
.out3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.obox{border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center;background:#08131f}.obox.best{border:2px solid var(--blue)}.obox .t{font-size:10px;font-weight:1000;color:var(--muted)}.obox .n{font-size:28px;font-weight:1000;margin-top:3px}.unit{font-size:11px;color:var(--muted)}
.hero{border:2px solid var(--blue);border-radius:18px;padding:18px;text-align:center;margin-top:13px;background:#08131f}.hero .small{font-size:11px;font-weight:1000;letter-spacing:.1em}.hero .big{font-size:58px;line-height:1;font-weight:1000;margin-top:6px}
.stagecard{background:#050b12;border:1px solid #1f3448;border-radius:18px;padding:16px}.stageLine{border-top:1px solid #18283a;padding:13px 0}.stageLine:first-child{border-top:0}.stageLine .hold{font-size:34px;font-weight:1000;color:#fff}.stageLine .meta{font-size:12px;color:#91a2b4;margin-top:3px}
.obs{border-top:1px solid #17283a;padding-top:11px;margin-top:11px}.obs:first-of-type{border-top:0}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;overscroll-behavior:contain;touch-action:none}
.sheet{width:min(720px,100%);background:#08131f;border:1px solid #264056;border-bottom:0;border-radius:22px 22px 0 0;padding:17px 15px max(20px,env(safe-area-inset-bottom));max-height:90%;overflow:auto;touch-action:none}
.wheelwrap{display:flex;justify-content:center;margin:14px 0;touch-action:none}
.wheel{width:300px;height:300px;max-width:82vw;max-height:82vw;aspect-ratio:1;border-radius:50%;border:2px solid var(--silver);position:relative;background:radial-gradient(circle,#091522 0 55%,#101e2c 56% 100%);touch-action:none;user-select:none;-webkit-user-select:none}
.tick{position:absolute;font-size:14px;font-weight:1000;transform:translate(-50%,-50%);color:#d8e2ec}.pointer{position:absolute;left:50%;top:50%;width:4px;height:108px;background:var(--blue);transform-origin:50% 100%;margin-left:-2px;margin-top:-108px;border-radius:4px}.pointer:after{content:"";position:absolute;left:-6px;top:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--blue)}.dot{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:var(--silver);transform:translate(-50%,-50%)}.wheelValue{text-align:center;font-size:38px;font-weight:1000}.wheelSub{text-align:center;color:var(--muted);font-weight:900}
.brandStrip{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brandStrip img{max-width:220px;width:42%;min-width:150px;background:#fff;border-radius:10px;padding:7px}

.liveStepsWrap{overflow-x:auto;scrollbar-width:none;padding-bottom:3px}.liveStepsWrap::-webkit-scrollbar{display:none}
.targetCard{border:1px solid #29435a;border-radius:16px;padding:14px;margin-top:14px;background:#07131f}
.targetHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #24394d}
.targetHeader strong{font-size:18px}
.stageTargetDivider{height:1px;background:#29435a;margin:14px 0}
@media(max-width:650px){
  .grid.two,.grid.three,.grid.four{grid-template-columns:1fr!important}
  .actions>.btn,.actions>.btn.secondary,.actions>.btn.outline{width:100%}
  .cardhead{align-items:flex-start;flex-wrap:wrap}
  .brandrow{align-items:flex-start}
  .bottomin{grid-template-columns:1fr 1fr}
}
.dimensionNote{font-size:11px;color:var(--muted);margin-top:6px}
.shapeDims{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.shapeDims.single{grid-template-columns:1fr}
@media(max-width:650px){.shapeDims,.shapeDims.single{grid-template-columns:1fr}}


.lockedPanel{border:1px solid #35536d;background:#091522;border-radius:14px;padding:13px;margin-top:12px}
.critical{border:2px solid var(--warn)!important}
.readonlyValue{font-size:20px;font-weight:900;color:#fff;margin-top:4px}
.auditBadge{font-size:10px;font-weight:1000;letter-spacing:.08em;color:#6bd4ed}
</style>

<body>
<div class="app">
<header>
<div class="brandrow">
  <div class="brand"><span style="color:#d9dee7">WIND</span> <span style="color:#009abf">SIGHT</span> <span style="font-size:12px;letter-spacing:.16em;color:#a7b4c3">PRS</span><small>BY ZEALTECH</small></div>
  <div class="save" id="saveState">Saved</div>
</div>
<nav id="nav"></nav>
</header>
<main id="main"></main>
</div>
<div class="bottom" id="bottom"><div class="bottomin"><button class="bigbtn" id="backBtn">← BACK</button><button class="bigbtn primary" id="nextBtn">NEXT →</button></div></div>

<div id="overlay" class="overlay hidden">
  <div class="sheet" id="sheet">
    <div class="cardhead"><div><div class="kicker">Angle tool</div><h2 id="wheelTitle">WIND FROM</h2></div><button class="btn secondary small" id="wheelDone">DONE</button></div>
    <div id="wheelDeg" class="wheelValue">000°</div><div id="wheelClock" class="wheelSub">12:00</div>
    <div class="wheelwrap"><div id="wheel" class="wheel"><div id="pointer" class="pointer"></div><div class="dot"></div></div></div>
    <label>Exact degrees<input id="wheelInput" type="text" inputmode="numeric"></label>
    <div class="note"><strong>Convention:</strong> WIND FROM for wind direction. TARGET DOF for target geometry.</div>
  </div>
</div>

<script>
const SCHEMA_VERSION=4, DBKEY="windSightPRS";
const MAX_TARGETS=10,MAX_POINTS=3,MAX_OBS=3,MAX_INTEL=5;
const LEGACY_KEYS=["windSightPRS_v24","prsWindPlatformV21","prsWindPlatformPrototypeV2"];
let st={screen:"home",step:0,selectedRifle:null,selectedAmmo:null,selectedMatch:null,selectedStage:null,liveStep:0,data:{schemaVersion:SCHEMA_VERSION,rifles:[],matches:[],drafts:{}}};
let saveTimer=null,wheelCtx=null,drag=false;

const IDB_NAME="windSightPRSDB",IDB_STORE="state",IDB_KEY="appData";
function idbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbPut(data){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(data,IDB_KEY);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function idbGet(){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readonly'),rq=tx.objectStore(IDB_STORE).get(IDB_KEY);rq.onsuccess=()=>resolve(rq.result||null);rq.onerror=()=>reject(rq.error)})}
async function hydrateFromIDB(){try{const d=await idbGet();if(!d)return;const localTs=Date.parse(st.data.lastSavedAt||0)||0,idbTs=Date.parse(d.lastSavedAt||0)||0;if(idbTs>localTs){st.data=migrateData(d);try{localStorage.setItem(DBKEY,JSON.stringify(st.data))}catch(e){}render();saveState.textContent='Recovered ✓'}}catch(e){}}

const iso=()=>new Date().toISOString(), uid=p=>p+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const normDec=x=>String(x??"").replace(",",".").trim();
const n=x=>{const raw=normDec(x);if(raw==="")return null;const v=Number(raw);return Number.isFinite(v)?v:null};
function norm(a){a=Number(a);return ((a%360)+360)%360}
function sdelta(a,b){return ((norm(a)-norm(b)+540)%360)-180}
function clock(deg){deg=norm(deg);let total=deg/360*720,mins=Math.round(total)%60,hr=Math.floor(total/60);if(hr===0)hr=12;if(hr>12)hr-=12;return hr+":"+String(mins).padStart(2,"0")}
function migrateData(d){
 if(!d||typeof d!=="object")return {schemaVersion:SCHEMA_VERSION,rifles:[],matches:[]};
 d.schemaVersion=d.schemaVersion||1;
 d.rifles=d.rifles||[]; d.matches=d.matches||[]; d.drafts=d.drafts||{}; d.lastSavedAt=d.lastSavedAt||null;
 d.matches.forEach(m=>{
   m.stages=m.stages||[];
   m.stages.forEach(s=>{
     s.wind=s.wind||{min:"",avg:"",max:"",now:"",avgDir:"",nowDir:"",window:"10 min"};
     s.points=s.points||[{id:uid("p"),distanceM:"",terrain:"Open / normal",obs:[]}];
     s.targetObs=s.targetObs||[]; s.intel=s.intel||[];
     s.matchIntel=s.matchIntel||null; s.revisionHistory=s.revisionHistory||[];
     s.targets=(s.targets||[]).map(t=>({...t,holdSide:t.holdSide||"L"}));
   });
 });
 d.schemaVersion=SCHEMA_VERSION;
 return d;
}
function safeRead(){
 try{
   let raw=localStorage.getItem(DBKEY);
   if(!raw){
     for(const k of LEGACY_KEYS){raw=localStorage.getItem(k); if(raw)break;}
   }
   if(raw){st.data=migrateData(JSON.parse(raw)); localStorage.setItem(DBKEY,JSON.stringify(st.data));}
 }catch(e){console.error(e)}
}
async function writeNow(){
 st.data.lastSavedAt=iso();let localOK=false,idbOK=false;
 try{localStorage.setItem(DBKEY,JSON.stringify(st.data));localOK=!!localStorage.getItem(DBKEY)}catch(e){}
 try{idbOK=await idbPut(JSON.parse(JSON.stringify(st.data)))}catch(e){}
 saveState.textContent=(localOK||idbOK)?"Saved ✓ "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}):"SAVE FAILED";
 return localOK||idbOK;
}
function autosave(){saveState.textContent="Saving…";clearTimeout(saveTimer);saveTimer=setTimeout(writeNow,350)}

function saveDraft(kind,obj){st.data.drafts=st.data.drafts||{};st.data.drafts[kind]=JSON.parse(JSON.stringify(obj));autosave()}
function loadDraft(kind){return st.data.drafts?.[kind]?JSON.parse(JSON.stringify(st.data.drafts[kind])):null}
function clearDraft(kind){if(st.data.drafts)delete st.data.drafts[kind];autosave()}


function exportData(){
 const blob=new Blob([JSON.stringify(st.data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="wind-sight-prs-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function validBackupShape(d){return !!(d&&typeof d==='object'&&Array.isArray(d.rifles)&&Array.isArray(d.matches))}
function importData(e){
 const file=e.target.files?.[0];if(!file)return;
 const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);if(!validBackupShape(parsed))throw new Error('shape');const d=migrateData(parsed);st.data=d;writeNow();render();alert("Data imported successfully.")}catch(err){alert("Invalid WIND SIGHT PRS backup file.")}};rd.readAsText(file);
}

function navItems(){return [["home","HOME"],["rifles","RIFLES"],["matches","MATCHES"],["reports","REPORTS"]]}
function renderNav(){nav.innerHTML="";navItems().forEach(([k,l])=>{let b=document.createElement("button");b.className="navbtn"+(st.screen===k?" active":"");b.textContent=l;b.onclick=()=>{saveCurrent();st.screen=k;st.step=0;render()};nav.appendChild(b)})}
function setBottom(show=true,nextLabel="NEXT →",nextVisible=true){bottom.style.display=show?"block":"none";nextBtn.textContent=nextLabel;nextBtn.style.visibility=nextVisible?"visible":"hidden"}
function render(){renderNav();main.innerHTML="";({home,rifles,rifleWizard,matches,matchWizard,liveStage,reports}[st.screen]||home)()}
function saveCurrent(){try{if(st.screen==="liveStage")captureLive()}catch(e){}autosave()}
function f(lbl,id,val,mode="text"){let im=mode==="numeric"?"numeric":mode==="decimal"?"decimal":"text",type=mode==="date"?"date":"text";return `<label>${lbl}<input id="${id}" type="${type}" inputmode="${im}" autocomplete="off" value="${esc(val??"")}"></label>`}
function ta(lbl,id,val){return `<label>${lbl}<textarea id="${id}">${esc(val??"")}</textarea></label>`}
function v(id){return document.getElementById(id)?.value??""}
function bindAuto(cb){main.querySelectorAll("input,select,textarea").forEach(el=>{el.addEventListener("input",cb);el.addEventListener("change",cb)})}

function home(){setBottom(false);main.innerHTML=`<div class="panel"><div class="kicker">Precision wind & match intelligence</div><h2>Ready</h2><p class="sub">Calibrate. Prepare. Execute. Analyze. Improve.</p><div class="actions"><button class="btn" id="newMatch">+ NEW MATCH</button><button class="btn secondary" id="newRifle">+ NEW RIFLE</button><button class="btn outline" id="exportBtn">EXPORT DATA</button><label class="btn outline" style="display:inline-flex;align-items:center;justify-content:center">IMPORT DATA<input id="importFile" type="file" accept="application/json" style="display:none"></label></div></div><div class="panel brandStrip"><div><div class="kicker">Product publisher</div><h3 style="margin-top:4px">WIND SIGHT PRS</h3><div class="small">Developed by ZealTech</div></div><img src="zealtech-landscape.png" alt="ZealTech"></div><div class="panel"><h3>Recent matches</h3><div id="recent"></div></div>`;
exportBtn.onclick=exportData;importFile.onchange=importData;newMatch.onclick=()=>{st.screen="matchWizard";st.step=0;st.selectedMatch=null;render()};newRifle.onclick=()=>{st.screen="rifleWizard";st.step=0;st.selectedRifle=null;st.selectedAmmo=null;render()};recent.innerHTML=st.data.matches.length?st.data.matches.slice().reverse().slice(0,5).map(matchCard).join(""):`<div class="note">No matches yet.</div>`;bindMatchCards()}

function rifles(){
 setBottom(false);
 main.innerHTML=`<div class="panel">
   <div class="cardhead"><div><div class="kicker">Persistent profiles</div><h2>Rifles</h2></div><button class="btn" id="add">+ RIFLE</button></div>
   <div id="list"></div>
 </div>`;
 add.onclick=()=>{st.screen="rifleWizard";st.step=0;st.selectedRifle=null;st.selectedAmmo=null;render()};
 list.innerHTML=st.data.rifles.length?st.data.rifles.map(r=>`
   <div class="card" data-r="${r.id}">
     <div class="cardhead">
       <div><strong>${esc(r.name)}</strong><div class="small">${esc(r.cartridge||"")}</div></div>
       <span class="tag ready">${r.ammo?.length||0} AMMO</span>
     </div>
     <div class="actions">
       <button class="btn secondary small editRifle">EDIT RIFLE</button>
       <button class="btn outline small addAmmo">+ AMMO</button>
     </div>
     ${(r.ammo||[]).map(a=>`
       <div class="listrow">
         <div><strong>${esc(a.name)}</strong><div class="small">${esc(a.bullet||"")} • ${esc(a.mv||"—")} fps • Cal v${a.currentCalibrationVersion||0}</div></div>
         <button class="btn outline small editAmmo" data-a="${a.id}">EDIT</button>
       </div>`).join("")}
   </div>`).join(""):`<div class="note">Create your first rifle profile.</div>`;
 document.querySelectorAll("[data-r]").forEach(el=>{
   el.querySelector(".editRifle").onclick=()=>{st.selectedRifle=el.dataset.r;st.selectedAmmo=null;st.screen="rifleWizard";st.step=0;render()};
   el.querySelector(".addAmmo").onclick=()=>{st.selectedRifle=el.dataset.r;st.selectedAmmo=null;st.screen="rifleWizard";st.step=1;render()};

function signedCross(angle,dof){return Math.sin(sdelta(angle,dof)*Math.PI/180)}
function sideFlipForTarget(t,fz){const angles=fz.directionSamples||[fz.dir],signs=[];for(const a of angles){const c=signedCross(a,n(t.dof)||0);if(Math.abs(c)>=0.08)signs.push(Math.sign(c))}return signs.includes(1)&&signs.includes(-1)}
function angleSensitivity(t,fz){const v=Math.abs(Math.sin(sdelta(fz.dir,n(t.dof)||0)*Math.PI/180));return v<0.5?"SENSITIVE":v<0.87?"MODERATE":"ROBUST"}
function buildPreShootSolution(s){const fz=fuse(s);return {createdAt:iso(),wind:{low:fz.low,best:fz.best,high:fz.high,dir:fz.dir,quality:fz.quality},targets:s.targets.map(t=>{const r=opt(t,fz),z=tWind(t,fz),flip=sideFlipForTarget(t,fz);return {targetId:t.id,label:t.label,distanceM:t.distanceM,dof:t.dof,expectedWD:z.expectedWD,sideFlip:flip,recommendedHold:r&&!flip?r.bh:null,recommendedSide:r&&!flip?(z.rel>=0?"R":"L"):null,pHit:r&&!flip?r.bp:null,kMin:t.kMin,kMax:t.kMax,targetWidthMil:r?r.w:null}})}}

function fuse(s){
 let mi=n(s.wind.min),av=n(s.wind.avg),ma=n(s.wind.max),dir=n(s.wind.avgDir);
 if(mi===null||av===null||ma===null||dir===null||mi<0||av<0||ma<0||!(mi<=av&&av<=ma)||!angleOK(dir))return {valid:false,reason:"Enter valid non-negative Calypso MIN / AVG / MAX and AVG WIND FROM.",quality:"WEAK"};
 if(s.targets.some(t=>String(t.dof??"").trim()===""||n(t.dof)===null))return {valid:false,reason:"Enter a DOF for every target before continuing to Kestrel.",quality:"WEAK"};
 let low=mi,best=av,high=ma,conflicts=[],speedObs=[],dirObs=[],pathNotes=[];
 const zones=[...s.points.map((p,idx)=>({name:`Point ${idx+1}`,terrain:p.terrain,obs:p.obs})),{name:"Target zone",terrain:s.targetTerrain,obs:s.targetObs}];
 zones.forEach(z=>{
   const zr=[];
   (z.obs||[]).forEach(o=>{
     const b=behavior[o.indicator]?.[+o.behavior||0]; if(!b)return;
     const rr=rel(o.indicator);
     if(b[1]!=null)zr.push({lo:b[1],hi:b[2],mid:(b[1]+b[2])/2,rel:rr,source:o.indicator,zone:z.name});
     if(o.quality!=="Unknown"&&String(o.dir??"").trim()!==""){
       const dr=b[3].includes("direction")?Math.max(rr,.8):rr;
       dirObs.push({deg:norm((+o.dir)+180),rel:dr*(o.quality==="Clear"?1:.55),zone:z.name});
     }
   });
   if(zr.length>1){const il=Math.max(...zr.map(x=>x.lo)),ih=Math.min(...zr.map(x=>x.hi));if(il>ih)conflicts.push(`${z.name}: observations disagree.`)}
   if(zr.length){const zl=Math.min(...zr.map(x=>x.lo)),zh=Math.max(...zr.map(x=>x.hi));if(zh<mi)pathNotes.push(`${z.name}: observed wind appears weaker than shooter bracket.`);if(zl>ma)pathNotes.push(`${z.name}: observed wind appears stronger than shooter bracket.`)}speedObs.push(...zr);
 });
 let sw=3,sm=3*av;speedObs.forEach(e=>{sw+=e.rel;sm+=e.rel*e.mid});best=Math.max(low,Math.min(high,sm/sw));
 const nowSp=n(s.wind.now); if(nowSp!==null&&nowSp>=low&&nowSp<=high)best=Math.max(low,Math.min(high,best*.7+nowSp*.3));
 let vx=3*Math.cos(dir*Math.PI/180),vy=3*Math.sin(dir*Math.PI/180);
 dirObs.forEach(e=>{vx+=e.rel*Math.cos(e.deg*Math.PI/180);vy+=e.rel*Math.sin(e.deg*Math.PI/180)});
 const nowDir=n(s.wind.nowDir);if(nowDir!==null&&Math.abs(sdelta(nowDir,dir))<=35){vx+=1.2*Math.cos(nowDir*Math.PI/180);vy+=1.2*Math.sin(nowDir*Math.PI/180)}
 const dBest=norm(Math.atan2(vy,vx)*180/Math.PI);
 const terrainSet=[s.wind.terrain||"Open / normal",...s.points.map(p=>p.terrain),s.targetTerrain||"Open / normal"];
 const terrainComplex=terrainSet.filter(x=>["Sheltered","Ridge / exposed","Valley / channel","Turbulent / complex","Unknown"].includes(x)).length;
 let q="STRONG"; if(conflicts.length||speedObs.length===0||terrainComplex>0)q="MODERATE"; if(conflicts.length>1||terrainComplex>2)q="WEAK";
 const learned=learnedBias(s);const directionSamples=[dir,...dirObs.map(x=>x.deg)];if(nowDir!==null&&angleOK(nowDir))directionSamples.push(norm(nowDir));
 return {valid:true,low,best,high,dir:dBest,quality:q,conflicts,pathNotes,learnedBias:learned,directionSamples}
}
function learnedBias(currentStage){
 let m=st.data.matches.find(x=>x.id===st.selectedMatch);if(!m)return null;let now=Date.now(),vals=[];
 (m.stages||[]).filter(x=>x.completedAt&&x.id!==currentStage.id).forEach(s=>{
   let ageH=(now-new Date(s.completedAt).getTime())/36e5,wt=Math.exp(-ageH/2);
   s.targets.forEach(t=>{let a=n(t.actualHold),lo=n(t.kMin),hi=n(t.kMax);if(a!==null&&lo!==null&&hi!==null&&hi>lo){let pos=(a-lo)/(hi-lo)-.5;vals.push({bias:pos,wt})}})
 });

}
function tWind(t,f){let rel=sdelta(f.dir,+t.dof||0),factor=Math.abs(Math.sin(rel*Math.PI/180));return {expectedWD:norm(f.dir-(+t.dof||0)),rel,factor,low:f.low*factor,best:f.best*factor,high:f.high*factor}}

function renderShoot(s){

 if(!fz.valid){live.innerHTML=`<div class="bad">${fz.reason}</div><div class="note">Go back to WIND / KESTREL and complete the required values.</div>`;return}
 let cards=s.targets.map(t=>shootHTML(t,fz)).join("");
 live.innerHTML=`<div class="cardhead"><div><h3>Shoot plan</h3><div class="small">Horizontal wind probability only</div></div><span class="tag live">${fz.quality}</span></div>${cards}<div class="card"><h3>Stage Card</h3><div class="stagecard">${s.targets.map(t=>stageLine(t,fz)).join("")}</div></div>`;
}
function widthMil(t){let d=n(t.distanceM),w=n(t.widthCm);return d&&w?((w/100)/d)*1000:null}
function triCDF(x,a,m,b){if(x<=a)return 0;if(x>=b)return 1;if(b<=a)return x>=b?1:0;if(m<=a+1e-9)return 1-Math.pow((b-x)/(b-a),2);if(m>=b-1e-9)return Math.pow((x-a)/(b-a),2);return x<=m?Math.pow(x-a,2)/((b-a)*(m-a)):1-Math.pow(b-x,2)/((b-a)*(b-m))}
function opt(t,f){let lo=n(t.kMin),hi=n(t.kMax),w=widthMil(t);if(lo===null||hi===null||hi<lo||!w)return null;let z=tWind(t,f),den=z.high-z.low,mode=den>1e-9?lo+(z.best-z.low)/den*(hi-lo):(lo+hi)/2;mode=Math.max(lo,Math.min(hi,mode));let bh=lo,bp=-1;for(let h=lo-w/2;h<=hi+w/2;h+=.001){let p=triCDF(h+w/2,lo,mode,hi)-triCDF(h-w/2,lo,mode,hi);if(p>bp){bp=p;bh=h}}let sl=hi-w/2,sh=lo+w/2;return {lo,hi,w,mode,bh,bp:Math.max(0,Math.min(1,bp)),safe:sl<=sh,sl,sh}}
function shootHTML(t,f){if(sideFlipForTarget(t,f))return `<div class="card critical"><div class="cardhead"><strong>${esc(t.label)} • ${esc(t.distanceM)} m</strong><span class="tag live">SIDE FLIP</span></div><div class="warn">Wind evidence crosses the bore line. Easy Mode will not issue a single-side optimal hold or P(hit). Recheck current direction and use the Kestrel bracket deliberately.</div></div>`;let r=opt(t,f);if(!r)return `<div class="note">${t.label}: enter valid Kestrel MIN/MAX holds and target width.</div>`;let ints=getStage().intel.filter(x=>x.target===t.label&&x.hold!=="").map(x=>n(x.hold)).filter(x=>x!==null),iw=ints.length&&(Math.max(...ints)<r.lo||Math.min(...ints)>r.hi);return `<div class="card"><div class="cardhead"><strong>${t.label} • ${t.distanceM} m</strong><span class="tag done">MODELLED WIND P(HIT)</span></div><div class="hero"><div class="small">OPTIMAL WIND HOLD</div><div class="big">${r.bh.toFixed(2)} ${tWind(t,f).rel>=0?"R":"L"}</div><div class="unit">mil</div></div><div class="listrow"><span>Kestrel bracket</span><strong>${r.lo.toFixed(2)}–${r.hi.toFixed(2)}</strong></div><div class="listrow"><span>MODELLED WIND P(HIT)</span><strong>${(r.bp*100).toFixed(0)}%</strong></div><div class="listrow"><span>Safe hold window</span><strong>${r.safe?r.sl.toFixed(2)+"–"+r.sh.toFixed(2):"NONE"}</strong></div>${ints.length?`<div class="${iw?"warn":"note"}">Shooter Intel: ${ints.map(x=>x.toFixed(2)).join(" / ")}${iw?" • outside model bracket":""}</div>`:""}<div class="small" style="margin-top:8px">Shape stored: ${esc(t.shape)}. Easy Mode probability is horizontal-wind-only; full 2D shape dispersion remains Advanced Mode.</div></div>`}
function stageLine(t,f){if(sideFlipForTarget(t,f))return `<div class="stageLine"><strong>${t.label} • ${t.distanceM} m</strong><div class="hold">FLIP</div><div class="meta">Recheck wind side / Kestrel</div></div>`;let r=opt(t,f);return `<div class="stageLine"><strong>${t.label} • ${t.distanceM} m</strong><div class="hold">${r?r.bh.toFixed(2)+" "+(tWind(t,f).rel>=0?"R":"L"):"—"}</div><div class="meta">${r?`Bracket ${r.lo.toFixed(2)}–${r.hi.toFixed(2)} • P(hit) ${(r.bp*100).toFixed(0)}%`:"Kestrel holds required"}</div></div>`}

function renderPost(s){
 live.innerHTML=`<div class="cardhead"><div><h3>Post-stage</h3><div class="small">Record what actually worked</div></div><span class="tag done">LEARNING</span></div>
 ${s.targets.map((t,i)=>`<div class="targetCard"><div class="targetHeader"><strong>${t.label} • ${t.distanceM} m</strong><span class="tag ready">TARGET ${i+1}</span></div><div class="grid two">${f("Actual working hold","act_"+i,t.actualHold,"decimal")}<label>Side<select id="side_${i}"><option ${t.holdSide==="L"?"selected":""}>L</option><option ${t.holdSide==="R"?"selected":""}>R</option></select></label></div></div>`).join("")}
 <div class="grid two">${f("Score / impacts","score",s.score,"numeric")}${f("Points possible","pts",s.pointsAvailable,"numeric")}</div>
 ${ta("Stage notes","postNotes",s.postNotes)}
 <div id="postMsg"></div>
 <div class="actions"><button class="btn" id="completeStage">MARK STAGE COMPLETE</button></div>`;
 bindAuto(captureLive);
 completeStage.textContent=s.correctionMode?"SAVE CORRECTION":"MARK STAGE COMPLETE";completeStage.onclick=()=>{captureLive();if(!validPost(s))return;if(!s.preShootSnapshot){alert("Pre-shoot snapshot missing. Return to SHOOT before completing this stage.");return;}const wasCorrection=!!s.completedAt;if(!s.completedAt)s.completedAt=iso();else s.correctedAt=iso();s.correctionMode=false;s.postStageSnapshot={createdAt:iso(),data:JSON.parse(JSON.stringify(s))};const mm=st.data.matches.find(x=>x.id===st.selectedMatch);if(wasCorrection&&mm?.completedAt){mm.revisionHistory=mm.revisionHistory||[];if(mm.finalSnapshot)mm.revisionHistory.push({createdAt:iso(),snapshot:mm.finalSnapshot});mm.correctedAt=iso();const copy=JSON.parse(JSON.stringify(mm));delete copy.finalSnapshot;mm.finalSnapshot=copy;}writeNow();st.screen="matchWizard";st.step=3;render()};
}
function validPost(s){
 let sc=n(s.score),pa=n(s.pointsAvailable),msg=[];
 if(sc!==null&&pa!==null&&(sc<0||sc>pa))msg.push("Score / impacts must be between 0 and points possible.");
 postMsg.innerHTML=msg.length?`<div class="bad">${msg.join(" ")}</div>`:"";
 return !msg.length;
}
function captureLive(){
 let s=getStage();if(!s)return;
 if(st.liveStep===0)s.targets.forEach((t,i)=>t.dof=angleValue(v("dof_"+i)));
 if(st.liveStep===1){s.wind.min=whole(v("wmin"));s.wind.avg=whole(v("wavg"));s.wind.max=whole(v("wmax"));s.wind.now=whole(v("wnow"));s.wind.avgDir=angleValue(v("wdir"));s.wind.nowDir=String(v("wndir")).trim()===""?"":angleValue(v("wndir"));s.wind.window=v("wwin");s.wind.terrain=v("wterrain")||"Open / normal"}
 if(st.liveStep===2){s.targetTerrain=v("targetTerrain")||s.targetTerrain||"Open / normal";s.points.forEach((p,pi)=>{p.distanceM=v("pd_"+pi);p.terrain=v("pt_"+pi);p.obs.forEach((o,oi)=>{o.indicator=v(`oi_point_${pi}_${oi}`)||o.indicator;o.behavior=+(v(`ob_point_${pi}_${oi}`)||0);o.quality=v(`oq_point_${pi}_${oi}`)||o.quality;if(o.quality!=="Unknown")o.dir=angleValue(v(`od_point_${pi}_${oi}`))})});s.targetObs.forEach((o,oi)=>{o.indicator=v(`oi_target_0_${oi}`)||o.indicator;o.behavior=+(v(`ob_target_0_${oi}`)||0);o.quality=v(`oq_target_0_${oi}`)||o.quality;if(o.quality!=="Unknown")o.dir=angleValue(v(`od_target_0_${oi}`))});s.intel.forEach((x,i)=>{x.target=v("intelT_"+i);x.hold=normDec(v("intelH_"+i))})}
 if(st.liveStep===3)s.targets.forEach((t,i)=>{t.kMin=normDec(v("kmin_"+i));t.kMax=normDec(v("kmax_"+i))});
 if(st.liveStep===5){s.targets.forEach((t,i)=>{t.actualHold=normDec(v("act_"+i));t.holdSide=v("side_"+i)});s.score=v("score");s.pointsAvailable=v("pts");s.postNotes=v("postNotes")}
 s.lastModifiedAt=iso();autosave()
}
function whole(x){let z=n(x);return z===null?"":String(Math.round(z))}
function getStage(){let m=st.data.matches.find(x=>x.id===st.selectedMatch);return m?.stages.find(x=>x.id===st.selectedStage)}

function reports(){
 setBottom(false);main.innerHTML=`<div class="panel"><div class="kicker">Post-match analytics</div><h2>Reports</h2><div id="rep"></div></div>`;
 if(!st.data.matches.length){rep.innerHTML=`<div class="note">No match history yet.</div>`;return}
 rep.innerHTML=st.data.matches.slice().reverse().map(m=>{const done=m.stages.filter(s=>s.completedAt),score=done.reduce((x,s)=>x+(n(s.score)||0),0),avail=done.reduce((x,s)=>x+(n(s.pointsAvailable)||0),0);const stagePcts=done.map(s=>{const a=n(s.score),b=n(s.pointsAvailable);return a!==null&&b>0?100*a/b:null}).filter(x=>x!==null);const avgStage=stagePcts.length?stagePcts.reduce((a,b)=>a+b,0)/stagePcts.length:null;let bracketTotal=0,bracketHits=0,errors=[];done.forEach(s=>{const sol=s.preShootSolution; if(!sol)return;s.targets.forEach(t=>{const ps=sol.targets?.find(x=>x.targetId===t.id||x.label===t.label);const actual=n(t.actualHold),lo=n(t.kMin),hi=n(t.kMax);if(actual!==null&&lo!==null&&hi!==null){bracketTotal++;if(actual>=Math.min(lo,hi)&&actual<=Math.max(lo,hi))bracketHits++}if(ps&&ps.recommendedHold!==null&&actual!==null){const aSigned=(t.holdSide==="R"?1:-1)*actual,pSigned=(ps.recommendedSide==="R"?1:-1)*ps.recommendedHold;errors.push(Math.abs(aSigned-pSigned))}})});const cap=bracketTotal?100*bracketHits/bracketTotal:null,mae=errors.length?errors.reduce((a,b)=>a+b,0)/errors.length:null;return `<div class="card"><div class="cardhead"><strong>${esc(m.name)}</strong><span class="tag done">${done.length}/${m.stages.length} STAGES</span></div><div class="grid four"><div><div class="small">SCORE</div><div class="metric">${avail?(100*score/avail).toFixed(0)+"%":"—"}</div></div><div><div class="small">AVG STAGE</div><div class="metric">${avgStage!==null?avgStage.toFixed(0)+"%":"—"}</div></div><div><div class="small">BRACKET CAPTURE</div><div class="metric">${cap!==null?cap.toFixed(0)+"%":"—"}</div></div><div><div class="small">MEAN HOLD ERROR</div><div class="metric">${mae!==null?mae.toFixed(2):"—"}</div><div class="small">mil</div></div></div><div class="note">${done.map(s=>`${esc(s.name)}: ${esc(s.wind?.avg||"—")} mph AVG • score ${esc(s.score||"—")}/${esc(s.pointsAvailable||"—")}`).join("<br>")||"No completed stages."}</div></div>`}).join("")
}

function openWheelField(id,title){let el=document.getElementById(id);wheelCtx={type:"field",id,title};openWheel(el?.value||0,title)}
function openObsWheel(where,pi,oi){captureLive();let s=getStage(),o=where==="target"?s.targetObs[oi]:s.points[pi].obs[oi];wheelCtx={type:"obs",where,pi,oi,title:"INDICATOR MOVING TO"};openWheel(o.dir||0,"INDICATOR MOVING TO")}
function openWheel(val,title){wheelTitle.textContent=title;setTimeout(positionTicks,0);document.body.classList.add("modal-open");overlay.classList.remove("hidden");setWheel(n(val)||0)}
function closeWheel(commit=true){if(commit&&wheelCtx){let val=String(Math.round(n(wheelInput.value)||0));if(wheelCtx.type==="field"){let el=document.getElementById(wheelCtx.id);if(el){el.value=val;el.dispatchEvent(new Event("input",{bubbles:true}));captureLive();writeNow()}}else{let s=getStage(),o=wheelCtx.where==="target"?s.targetObs[wheelCtx.oi]:s.points[wheelCtx.pi].obs[wheelCtx.oi];o.dir=val;captureLive();writeNow();if(st.liveStep===2)renderDownrange(s)}}overlay.classList.add("hidden");document.body.classList.remove("modal-open");wheelCtx=null}
function setWheel(vv){let d=norm(vv);pointer.style.transform=`rotate(${d}deg)`;wheelDeg.textContent=String(Math.round(d)).padStart(3,"0")+"°";wheelClock.textContent=clock(d);wheelInput.value=String(Math.round(d))}
function evtAngle(e){e.preventDefault();let r=wheel.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.atan2(x,-y)*180/Math.PI;if(d<0)d+=360;setWheel(d)}
wheel.addEventListener("pointerdown",e=>{e.preventDefault();drag=true;wheel.setPointerCapture(e.pointerId);evtAngle(e)},{passive:false});
wheel.addEventListener("pointermove",e=>{if(drag)evtAngle(e)},{passive:false});
wheel.addEventListener("pointerup",e=>{drag=false;e.preventDefault()},{passive:false});
wheel.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
sheet.addEventListener("touchmove",e=>{if(e.target.closest(".wheel"))e.preventDefault()},{passive:false});
overlay.addEventListener("touchmove",e=>{if(e.target===overlay)e.preventDefault()},{passive:false});
wheelInput.addEventListener("input",()=>setWheel(n(wheelInput.value)||0));wheelDone.onclick=()=>closeWheel(true);
function positionTicks(){const size=wheel.clientWidth,c=size/2,r=size*.413;[...wheel.querySelectorAll(".tick")].forEach((el,idx)=>{let deg=(idx+1)*30,rad=(deg-90)*Math.PI/180;el.style.left=(c+r*Math.cos(rad))+"px";el.style.top=(c+r*Math.sin(rad))+"px"})}
for(let h=1;h<=12;h++){let el=document.createElement("div");el.className="tick";el.textContent=h;wheel.appendChild(el)}
window.addEventListener("resize",positionTicks);setTimeout(positionTicks,0);

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}
safeRead();render();hydrateFromIDB();
</script>
</body>
