    <div id="wheelDeg" class="wheelValue">000°</div><div id="wheelClock" class="wheelSub">12:00</div>

  </div>

<script>
const SCHEMA_VERSION=4, DBKEY="windSightPRS";
const MAX_TARGETS=10,MAX_POINTS=3,MAX_OBS=3,MAX_INTEL=5;
const LEGACY_KEYS=["windSightPRS_v24","prsWindPlatformV21","prsWindPlatformPrototypeV2"];
let st={screen:"home",step:0,selectedRifle:null,selectedAmmo:null,selectedMatch:null,selectedStage:null,liveStep:0,data:{schemaVersion:SCHEMA_VERSION,rifles:[],matches:[],drafts:{}}};
let saveTimer=null,wheelCtx=null,drag=false;

const IDB_NAME="windSightPRSDB",IDB_STORE="state",IDB_KEY="appData",IDB_TELEMETRY="telemetry";
function idbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open(IDB_NAME,2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);if(!db.objectStoreNames.contains(IDB_TELEMETRY)){const s=db.createObjectStore(IDB_TELEMETRY,{keyPath:'id',autoIncrement:true});s.createIndex('stage','stageId',{unique:false});s.createIndex('match','matchId',{unique:false});s.createIndex('time','t',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbPut(data){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(data,IDB_KEY);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function idbGet(){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readonly'),rq=tx.objectStore(IDB_STORE).get(IDB_KEY);rq.onsuccess=()=>resolve(rq.result||null);rq.onerror=()=>reject(rq.error)})}
async function idbPutTelemetry(records){if(!records?.length)return true;const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_TELEMETRY,'readwrite'),stx=tx.objectStore(IDB_TELEMETRY);records.forEach(r=>stx.add(r));tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function idbGetStageTelemetry(stageId){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_TELEMETRY,'readonly'),idx=tx.objectStore(IDB_TELEMETRY).index('stage'),rq=idx.getAll(stageId);rq.onsuccess=()=>resolve(rq.result||[]);rq.onerror=()=>reject(rq.error)})}
async function hydrateFromIDB(){try{const d=await idbGet();if(!d)return;const localTs=Date.parse(st.data.lastSavedAt||0)||0,idbTs=Date.parse(d.lastSavedAt||0)||0;if(idbTs>localTs){st.data=migrateData(d);try{localStorage.setItem(DBKEY,JSON.stringify(st.data))}catch(e){}render();saveState.textContent='Recovered ✓'}}catch(e){}}

const iso=()=>new Date().toISOString(), uid=p=>p+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const normDec=x=>String(x??"").replace(",",".").trim();
const n=x=>{const raw=normDec(x);if(raw==="")return null;const v=Number(raw);return Number.isFinite(v)?v:null};
function norm(a){a=Number(a);return ((a%360)+360)%360}
function sdelta(a,b){return ((norm(a)-norm(b)+540)%360)-180}
function clock(deg){deg=norm(deg);let total=deg/360*720,mins=Math.round(total)%60,hr=Math.floor(total/60);if(hr===0)hr=12;if(hr>12)hr-=12;return hr+":"+String(mins).padStart(2,"0")}
function migrateData(d){
 if(!d||typeof d!=="object")return {schemaVersion:SCHEMA_VERSION,rifles:[],matches:[]};
 d.schemaVersion=d.schemaVersion||1;
 d.rifles=d.rifles||[]; d.matches=d.matches||[]; d.drafts=d.drafts||{}; d.trash=d.trash||{matches:[]}; d.trash.matches=d.trash.matches||[]; d.lastSavedAt=d.lastSavedAt||null;
 d.matches.forEach(m=>{
   m.stages=m.stages||[];
   m.stages.forEach(s=>{
     s.wind=s.wind||{min:"",avg:"",max:"",now:"",avgDir:"",nowDir:"",window:"10 min"};
     s.points=s.points||[{id:uid("p"),distanceM:"",terrain:"Open / normal",obs:[]}];
     s.targetObs=s.targetObs||[]; s.intel=s.intel||[];
     s.matchIntel=s.matchIntel||null; s.revisionHistory=s.revisionHistory||[];
     s.targets=(s.targets||[]).map(t=>({...t,holdSide:t.holdSide||"L"}));
   });
 });
 d.schemaVersion=SCHEMA_VERSION;
 return d;
}
function safeRead(){
 try{
   let raw=localStorage.getItem(DBKEY);
   if(!raw){
     for(const k of LEGACY_KEYS){raw=localStorage.getItem(k); if(raw)break;}
   }
   if(raw){st.data=migrateData(JSON.parse(raw)); localStorage.setItem(DBKEY,JSON.stringify(st.data));}
 }catch(e){console.error(e)}
}
let idbSaveTimer=null,lastSerialized="";
function serializeData(){
 st.data.lastSavedAt=iso();
 return JSON.stringify(st.data);
}
function writeLocalFast(){
 try{
   const raw=serializeData();lastSerialized=raw;localStorage.setItem(DBKEY,raw);
   saveState.textContent="Saved ✓";
   clearTimeout(idbSaveTimer);
   idbSaveTimer=setTimeout(()=>{try{idbPut(JSON.parse(raw))}catch(e){}},700);
   return true;
 }catch(e){saveState.textContent="SAVE FAILED";return false}
}
async function writeNow(){
 const raw=serializeData();lastSerialized=raw;let localOK=false,idbOK=false;
 try{localStorage.setItem(DBKEY,raw);localOK=!!localStorage.getItem(DBKEY)}catch(e){}
 try{idbOK=await idbPut(JSON.parse(raw))}catch(e){}
 saveState.textContent=(localOK||idbOK)?"Saved ✓":"SAVE FAILED";
 return localOK||idbOK;
}
function autosave(){
 saveState.textContent="Saving…";
 clearTimeout(saveTimer);
 saveTimer=setTimeout(writeLocalFast,120);
}

function saveDraft(kind,obj){st.data.drafts=st.data.drafts||{};st.data.drafts[kind]=JSON.parse(JSON.stringify(obj));autosave()}
function loadDraft(kind){return st.data.drafts?.[kind]?JSON.parse(JSON.stringify(st.data.drafts[kind])):null}
function clearDraft(kind){if(st.data.drafts)delete st.data.drafts[kind];autosave()}


document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")writeLocalFast()});
window.addEventListener("pagehide",()=>{try{flushCalypsoTelemetry()}catch(e){}writeLocalFast()});
function exportData(){
 const blob=new Blob([JSON.stringify(st.data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="wind-sight-prs-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function validBackupShape(d){return !!(d&&typeof d==='object'&&Array.isArray(d.rifles)&&Array.isArray(d.matches))}
function importData(e){
 const file=e.target.files?.[0];if(!file)return;
 const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);if(!validBackupShape(parsed))throw new Error('shape');const d=migrateData(parsed);st.data=d;writeNow();render();alert("Data imported successfully.")}catch(err){alert("Invalid WIND SIGHT PRS backup file.")}};rd.readAsText(file);
}

function navItems(){return [["home","HOME"],["matches","MATCHES"],["calypso","CALYPSO"],["rifles","PROFILES"],["reports","REPORTS"]]}
function renderNav(){nav.innerHTML="";navItems().forEach(([k,l])=>{let b=document.createElement("button");b.className="navbtn"+(st.screen===k?" active":"");b.textContent=l;b.onclick=()=>{saveCurrent();st.screen=k;st.step=0;render()};nav.appendChild(b)})}
function setBottom(show=true,nextLabel="NEXT →",nextVisible=true){bottom.style.display=show?"block":"none";nextBtn.textContent=nextLabel;nextBtn.style.visibility=nextVisible?"visible":"hidden"}

const CALYPSO={
 // Calypso CUPS 4.0 legacy/open BLE UUIDs published by Calypso.
 LEGACY_SERVICE:"0000180d-1212-efde-1523-785feabcd123",
 LEGACY_CHAR:"00002a39-1212-efde-1523-785feabcd123",
 SERVICE_BATT:"battery_service",
 CHAR_BATT:"battery_level",
 SERVICE_INFO:"device_information",
 CHAR_MODEL:"model_number_string",
 CHAR_FW:"firmware_revision_string"
};
const calypsoRuntime={device:null,server:null,status:"idle",lastError:"",speedChar:null,dirChar:null,battChar:null,samples:[],model:"",firmware:"",battery:null,batteryMv:null,lastSeen:null,connecting:false,stageSessionId:null,stageSessionStart:0,lastPredictionAt:0,predictionTimer:null,lastUiAt:0,persistTimer:null,pendingTelemetry:[],lastStateKey:"",protocolVariant:"NONE",recordStandalone:false,nativeListenerBound:false};
function ensureCalypsoSettings(){
 st.data.settings=st.data.settings||{};
 st.data.settings.calypso=st.data.settings.calypso||{enabled:true,paired:false,name:"",directionOffsetDeg:0,referenceConfigured:false,referenceBearingDeg:0,protocolVerified:false,sampleWindowSec:30,predictionHz:1,deviceId:"",standaloneWindowSec:120};
 const c=st.data.settings.calypso;
 if(c.referenceConfigured==null)c.referenceConfigured=false;
 if(c.referenceBearingDeg==null)c.referenceBearingDeg=0;
 if(c.protocolVerified==null)c.protocolVerified=false;
 if(!c.predictionHz)c.predictionHz=1;if(c.deviceId==null)c.deviceId="";if(!c.standaloneWindowSec)c.standaloneWindowSec=120;
 return c;
}

function findStageById(stageId){
 for(const m of st.data.matches||[]){const s=(m.stages||[]).find(x=>x.id===stageId);if(s)return {m,s}}
 return {m:null,s:null};
}
async function flushCalypsoTelemetry(){
 if(!calypsoRuntime.pendingTelemetry.length)return;
 const batch=calypsoRuntime.pendingTelemetry.splice(0);
 try{await idbPutTelemetry(batch)}catch(e){console.error("Telemetry IDB",e);calypsoRuntime.pendingTelemetry.unshift(...batch);return}
 const groups={};batch.forEach(r=>{(groups[r.stageId]||(groups[r.stageId]=[])).push(r)});
 Object.entries(groups).forEach(([sid,rows])=>{const {s}=findStageById(sid);if(!s)return;s.calypsoSampleCount=(s.calypsoSampleCount||0)+rows.length;s.calypsoBlocks30s=mergeCalypsoBlocks(s.calypsoBlocks30s||[],buildCalypsoBlocks(rows,30));s.calypsoLastPersistedAt=iso()});
 writeLocalFast();
}
function mergeCalypsoBlocks(existing,incoming){const m=new Map();[...(existing||[]),...(incoming||[])].forEach(b=>{const k=b.start,old=m.get(k);if(!old)m.set(k,b);else{const n1=old.n||0,n2=b.n||0,nx=n1+n2;m.set(k,{start:k,end:Math.max(old.end,b.end),avg:(old.avg*n1+b.avg*n2)/Math.max(1,nx),sd:Math.max(old.sd,b.sd),min:Math.min(old.min,b.min),max:Math.max(old.max,b.max),dir:b.dir??old.dir,n:nx})}});return [...m.values()].sort((a,b)=>a.start-b.start)}
function startCalypsoStageSession(s){
 if(!s)return;
 if(calypsoRuntime.stageSessionId===s.id)return;
 // Flush samples to their ORIGINAL stage before switching ownership.
 if(calypsoRuntime.pendingTelemetry.length)flushCalypsoTelemetry();
 calypsoRuntime.stageSessionId=s.id;calypsoRuntime.stageSessionStart=Date.now();s.calypsoSessionStart=iso();s.calypsoBlocks30s=s.calypsoBlocks30s||[];calypsoRuntime.samples=[];calypsoRuntime.lastStateKey="";
}
function scheduleTelemetryFlush(){clearTimeout(calypsoRuntime.persistTimer);calypsoRuntime.persistTimer=setTimeout(()=>flushCalypsoTelemetry(),2500)}
function predictionStateKey(){const e=calypsoStateEstimate();if(!e)return "none";return [Math.round((e.speed||0)*5)/5,e.dir==null?"x":Math.round(e.dir/2)*2,e.trend,e.regime,Math.round((e.ti||0)*20)/20].join("|")}
function scheduleLivePrediction(){
 const cfg=ensureCalypsoSettings(),now=Date.now(),key=predictionStateKey();if(key===calypsoRuntime.lastStateKey)return;calypsoRuntime.lastStateKey=key;
 const minGap=1000/Math.max(.25,Math.min(1,n(cfg.predictionHz)||1)),wait=Math.max(0,minGap-(now-calypsoRuntime.lastPredictionAt));if(calypsoRuntime.predictionTimer)return;
 calypsoRuntime.predictionTimer=setTimeout(()=>{calypsoRuntime.predictionTimer=null;calypsoRuntime.lastPredictionAt=Date.now();const s=getStage();if(s)renderLiveCommand(s);if(st.screen==="calypso")renderCalypsoLivePanel()},wait);
}

function nativeCalypsoBridge(){
 try{return window.Capacitor?.Plugins?.WindSightBLE||window.WindSightBLE||null}catch(e){return null}
}
function calypsoSupported(){return !!nativeCalypsoBridge()||!!navigator.bluetooth}
function calypsoTransport(){return nativeCalypsoBridge()?"NATIVE BLE":navigator.bluetooth?"WEB BLE":"UNAVAILABLE"}
function calypsoStatusText(){
 if(!calypsoSupported())return "CALYPSO • NATIVE BLE REQUIRED";
 if(calypsoRuntime.status==="connected")return `CALYPSO • CONNECTED${calypsoRuntime.battery!=null?` • ${calypsoRuntime.battery}%`:""}`;
 if(calypsoRuntime.status==="connecting")return "CALYPSO • CONNECTING…";
 if(calypsoRuntime.status==="error")return "CALYPSO • CONNECTION ERROR";
 return "CALYPSO • DISCONNECTED";
}
function calypsoDotClass(){
 return calypsoRuntime.status==="connected"?"connected":calypsoRuntime.status==="connecting"?"connecting":calypsoRuntime.status==="error"?"error":"";
}
function decodeU16LE(dv){return dv.getUint16(0,true)}
function calypsoMpsToMph(v){return v*2.2369362921}
function circularMeanDeg(vals){
 vals=(vals||[]).filter(v=>n(v)!==null);
 if(!vals.length)return null;let x=0,y=0;
 vals.forEach(v=>{const a=n(v)*Math.PI/180;x+=Math.cos(a);y+=Math.sin(a)});
 return norm(Math.atan2(y,x)*180/Math.PI);
}

function weightedCircularMean(samples,weightFn){
 let x=0,y=0,w=0;
 samples.filter(s=>n(s.dir)!==null).forEach(s=>{const ww=weightFn(s);const a=n(s.dir)*Math.PI/180;x+=ww*Math.cos(a);y+=ww*Math.sin(a);w+=ww});
 if(!w)return {mean:null,R:0};
 return {mean:norm(Math.atan2(y,x)*180/Math.PI),R:Math.sqrt(x*x+y*y)/w};
}
function weightedStats(samples,key,weightFn){
 let w=0,m=0;for(const s of samples){const ww=weightFn(s);w+=ww;m+=ww*s[key]}
 if(!w)return {mean:null,sd:null};
 m/=w;let v=0;for(const s of samples){const ww=weightFn(s);v+=ww*(s[key]-m)*(s[key]-m)}
 return {mean:m,sd:Math.sqrt(v/w)};
}
function linTrend(samples,key,windowMs){
 const cut=Date.now()-windowMs,ss=samples.filter(x=>x.t>=cut);if(ss.length<4)return 0;
 const t0=ss[0].t;let sx=0,sy=0,sxx=0,sxy=0,nc=0;
 ss.forEach(s=>{const x=(s.t-t0)/1000,y=s[key];sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;nc++});
 const den=nc*sxx-sx*sx;if(!den)return 0;return (nc*sxy-sx*sy)/den;
}
function calypsoWindow(sec){
 const cut=Date.now()-sec*1000;
 return calypsoRuntime.samples.filter(x=>x.t>=cut);
}
function calypsoStateEstimate(){
 const all=calypsoRuntime.samples;if(!all.length)return null;

function loadAmmoWork(a){

 if(!hasCurrent&&last?.data)a._work=JSON.parse(JSON.stringify(last.data));

 a._work.meta.D=a._work.meta.D||{distance:700,stageWindFrom:90,ws1:8,ws2:12};

function readMobileCal(key,a){

function readMobileCalD(a){

 });

function calypsoMeasuredTargetWD(tt){
 const cfg=ensureCalypsoSettings(),stx=calypsoStats();
 if(!cfg.referenceConfigured||!stx?.dirReferenced||stx.dir===null)return null;

function kTargetHTML(t,i,fz){const ds=targetDirectionState(getStage(),t),cwd=calypsoMeasuredTargetWD(t);return `<div class="card"><div class="cardhead"><strong>${esc(t.label)} • ${esc(t.distanceM)} m</strong><span class="tag ready">SOLVER</span></div><div class="hero"><div class="small">BALLISTIC INPUT / VERIFY</div><div style="font-size:24px;font-weight:1000;margin-top:8px">DOF ${String(Math.round(norm(n(t.dof)||0))).padStart(3,"0")}°</div>${cwd!==null?`<div class="small" style="margin-top:8px">CALYPSO / MEASURED TARGET WD</div><div style="font-size:22px;font-weight:1000">${String(Math.round(cwd)).padStart(3,"0")}°</div>`:`<div class="small" style="margin-top:8px">CALYPSO TARGET WD — NOT REFERENCED</div>`}<div class="small" style="margin-top:8px">WIND SIGHT FUSED TARGET WD</div><div style="font-size:32px;font-weight:1000;color:var(--blue)">${String(Math.round(ds.targetWD)).padStart(3,"0")}°</div><div class="small">${clock(ds.targetWD)} • SAME DIRECTION STATE USED BY ACCURACY ENGINE</div></div><div class="out3"><div class="obox"><div class="t">LOW WIND</div><div class="n">${fz.low.toFixed(0)}</div><div class="unit">mph</div></div><div class="obox best"><div class="t">BEST WIND</div><div class="n">${fz.best.toFixed(0)}</div><div class="unit">mph</div></div><div class="obox"><div class="t">HIGH WIND</div><div class="n">${fz.high.toFixed(0)}</div><div class="unit">mph</div></div></div><div class="grid two">${f("Solver MIN hold","kmin_"+i,t.kMin,"decimal")}${f("Solver MAX hold","kmax_"+i,t.kMax,"decimal")}</div><div class="note">Enter solver holds using the FUSED Target WD shown above. WIND SIGHT treats these holds as already angle-corrected and does not apply the angle a second time.</div></div>`}
function fuse(s){
 let mi=n(s.wind.min),av=n(s.wind.avg),ma=n(s.wind.max),dir=n(s.wind.avgDir);
 if(mi===null||av===null||ma===null||dir===null||mi<0||av<0||ma<0||!(mi<=av&&av<=ma)||!angleOK(dir))return {valid:false,reason:"Enter valid non-negative Calypso MIN / AVG / MAX and AVG WIND FROM.",quality:"WEAK"};
 if(s.targets.some(t=>String(t.dof??"").trim()===""||n(t.dof)===null))return {valid:false,reason:"Enter a DOF for every target before continuing to Kestrel.",quality:"WEAK"};
 let low=mi,best=av,high=ma,conflicts=[],speedObs=[],dirObs=[],pathNotes=[];
 const zones=[...s.points.map((p,idx)=>({name:`Point ${idx+1}`,terrain:p.terrain,obs:p.obs})),{name:"Target zone",terrain:s.targetTerrain,obs:s.targetObs}];
 zones.forEach(z=>{
   const zr=[];
   (z.obs||[]).forEach(o=>{
     const b=behavior[o.indicator]?.[+o.behavior||0]; if(!b)return;
     const rr=rel(o.indicator);
     if(b[1]!=null)zr.push({lo:b[1],hi:b[2],mid:(b[1]+b[2])/2,rel:rr,source:o.indicator,zone:z.name});
     if(o.quality!=="Unknown"&&String(o.dir??"").trim()!==""){
       const dr=b[3].includes("direction")?Math.max(rr,.8):rr;
       dirObs.push({deg:norm((+o.dir)+180),rel:dr*(o.quality==="Clear"?1:.55),zone:z.name});
     }
   });
   if(zr.length>1){const il=Math.max(...zr.map(x=>x.lo)),ih=Math.min(...zr.map(x=>x.hi));if(il>ih)conflicts.push(`${z.name}: observations disagree.`)}
   if(zr.length){const zl=Math.min(...zr.map(x=>x.lo)),zh=Math.max(...zr.map(x=>x.hi));if(zh<mi)pathNotes.push(`${z.name}: observed wind appears weaker than shooter bracket.`);if(zl>ma)pathNotes.push(`${z.name}: observed wind appears stronger than shooter bracket.`)}speedObs.push(...zr);
 });
 let sw=3,sm=3*av;speedObs.forEach(e=>{sw+=e.rel;sm+=e.rel*e.mid});best=Math.max(low,Math.min(high,sm/sw));
 const nowSp=n(s.wind.now); if(nowSp!==null&&nowSp>=low&&nowSp<=high)best=Math.max(low,Math.min(high,best*.7+nowSp*.3));
 let vx=3*Math.cos(dir*Math.PI/180),vy=3*Math.sin(dir*Math.PI/180);
 dirObs.forEach(e=>{vx+=e.rel*Math.cos(e.deg*Math.PI/180);vy+=e.rel*Math.sin(e.deg*Math.PI/180)});
 const nowDir=n(s.wind.nowDir);if(nowDir!==null&&Math.abs(sdelta(nowDir,dir))<=35){vx+=1.2*Math.cos(nowDir*Math.PI/180);vy+=1.2*Math.sin(nowDir*Math.PI/180)}
 const dBest=norm(Math.atan2(vy,vx)*180/Math.PI);
 const terrainSet=[s.wind.terrain||"Open / normal",...s.points.map(p=>p.terrain),s.targetTerrain||"Open / normal"];
 const terrainComplex=terrainSet.filter(x=>["Sheltered","Ridge / exposed","Valley / channel","Turbulent / complex","Unknown"].includes(x)).length;
 let q="STRONG"; if(conflicts.length||speedObs.length===0||terrainComplex>0)q="MODERATE"; if(conflicts.length>1||terrainComplex>2)q="WEAK";
 const learned=learnedBias(s);const directionSamples=[dir,...dirObs.map(x=>x.deg)];if(nowDir!==null&&angleOK(nowDir))directionSamples.push(norm(nowDir));
 return {valid:true,low,best,high,dir:dBest,quality:q,conflicts,pathNotes,learnedBias:learned,directionSamples}
}
function learnedBias(currentStage){
 let m=st.data.matches.find(x=>x.id===st.selectedMatch);if(!m)return null;let now=Date.now(),vals=[];
 (m.stages||[]).filter(x=>x.completedAt&&x.id!==currentStage.id).forEach(s=>{
   let ageH=(now-new Date(s.completedAt).getTime())/36e5,wt=Math.exp(-ageH/2);
   s.targets.forEach(t=>{let a=n(t.actualHold),lo=n(t.kMin),hi=n(t.kMax);if(a!==null&&lo!==null&&hi!==null&&hi>lo){let pos=(a-lo)/(hi-lo)-.5;vals.push({bias:pos,wt})}})
 });
 if(!vals.length)return null;let sw=vals.reduce((x,y)=>x+y.wt,0),b=vals.reduce((x,y)=>x+y.bias*y.wt,0)/sw;return Math.max(-.5,Math.min(.5,b))*.5
}
function tWind(t,f){let rel=sdelta(f.dir,+t.dof||0),factor=Math.abs(Math.sin(rel*Math.PI/180));return {expectedWD:norm(f.dir-(+t.dof||0)),rel,factor,low:f.low*factor,best:f.best*factor,high:f.high*factor}}


function hold1(x){const z=n(x);return z===null?"—":z.toFixed(1)}

function robustHoldText(sol){const a=hold1(sol.robustMin),b=hold1(sol.robustMax),side=sol.robustSide||sol.side||"";return a===b?`${a} ${side}`:`${a}–${b} ${side}`}
function shootResultV2(tt,sol,fallback,z){

 const dims=targetDimsMil(tt),miss=suggestedMissCorrection(tt),confClass=sol.confidence==="HIGH"?"confHigh":sol.confidence==="MEDIUM"?"confMed":"confLow",lo=Math.min(n(tt.kMin)||0,n(tt.kMax)||0),hi=Math.max(n(tt.kMin)||0,n(tt.kMax)||0);
 return `<div class="shootCompact"><div class="shootTop"><div><div class="shootTarget">${esc(tt.label)} • ${esc(tt.distanceM)} m</div><div class="shootMeta">${esc(tt.shape||"Target")} • ${esc(targetSizeText(tt))}</div></div><span class="tag done">CORE 4</span></div><div class="shootHold">${hold1(sol.hold)} ${sol.side}<small>WIND SIGHT HOLD</small></div><div class="wsHoldBand"><div><span>MIN</span><strong>${hold1(lo)} ${sol.side}</strong></div><div class="rec"><span>CALL</span><strong>${hold1(sol.hold)} ${sol.side}</strong></div><div><span>MAX</span><strong>${hold1(hi)} ${sol.side}</strong></div></div><div class="wsMetricGrid"><div class="wsMetric primaryMetric"><div class="k">WIND HIT</div><div class="v">${Math.round(sol.windHit*100)}%</div><div class="impactSecondary">Est. impact ${Math.round(sol.modeledHit*100)}%</div></div><div class="wsMetric"><div class="k">CONFIDENCE</div><div class="v ${confClass}">${sol.confidence}</div></div><div class="wsMetric"><div class="k">ROBUST</div><div class="v">${robustHoldText(sol)}</div></div><div class="wsMetric"><div class="k">MISS</div><div class="v">${miss!==null?`${hold1(miss)} mil`:"—"}</div>${dims?`<div class="fastHint">${dims.w.toFixed(1)} mil target</div>`:""}</div></div></div>`;
}
function stageLineV2(tt,sol,fallback,z){if(sol?.sideAmbiguous)return `<div class="stageLine"><strong>${esc(tt.label)} • ${esc(tt.distanceM)} m</strong><div class="hold">SIDE?</div><div class="meta">Recheck wind direction</div></div>`;if(sol)return `<div class="stageLine"><strong>${esc(tt.label)} • ${esc(tt.distanceM)} m • ${esc(targetSizeText(tt))}</strong><div class="hold">${hold1(sol.hold)} ${sol.side}</div><div class="meta">Wind Hit ${Math.round(sol.windHit*100)}% • ${sol.confidence} • Robust ${robustHoldText(sol)}</div></div>`;return `<div class="stageLine"><strong>${esc(tt.label)}</strong><div class="hold">—</div><div class="meta">Solver holds required</div></div>`}

function suggestedMissCorrection(tt){
 const dm=targetDimsMil(tt);
 if(!dm||!(dm.w>0))return null;
 return Number((dm.w*0.75).toFixed(1));
}

function targetDimsMil(tt){
 const d=n(tt.distanceM),w=n(tt.widthCm),h=n(tt.heightCm||tt.widthCm);
 if(!(d>0&&w>0))return null;
 return {w:(w/100)/d*1000,h:((h>0?h:w)/100)/d*1000};
}
function targetSizeText(tt){
 const dm=targetDimsMil(tt);if(!dm)return "Target size incomplete";
 const shape=tt.shape||"Target",w=n(tt.widthCm),h=n(tt.heightCm||tt.widthCm);
 if(shape==="Round")return `Ø${w} cm • Ø${dm.w.toFixed(2)} mil`;
 if(["Square","Diamond"].includes(shape))return `${w} × ${w} cm • ${dm.w.toFixed(2)} × ${dm.w.toFixed(2)} mil`;
 return `${w} × ${h} cm • ${dm.w.toFixed(2)} × ${dm.h.toFixed(2)} mil`;

function windSightImpactScore(r){return Math.round(Math.max(0,Math.min(1,r?.bp||0))*100)}
function windSightAimTip(tt,r,z){
 if(!r)return null;
 const span=Math.max(.001,r.hi-r.lo),pos=(r.bh-r.lo)/span,side=z.rel>=0?"RIGHT":"LEFT";
 if(r.w>=span)return {label:"CENTER",text:"The target's horizontal angular width covers the full solver bracket. Center is the most forgiving visual reference."};
 if(pos<.35)return {label:"CENTER",text:"The optimum is toward the lower-wind portion of the bracket. Keep center as the visual reference."};
 if(pos<.78)return {label:`${side}-CENTRE`,text:`Bias the visual reference toward ${side.toLowerCase()}-centre while using the numerical hold shown above.`};

}
function whyOptimalHold(tt,r,fz){

}

function widthMil(t){let d=n(t.distanceM),w=n(t.widthCm);return d&&w?((w/100)/d)*1000:null}
function matchLearningStats(currentStage){
 const m=st.data.matches.find(x=>x.id===st.selectedMatch);if(!m)return null;let total=0,inside=0,errs=[];
 (m.stages||[]).filter(s=>s.completedAt&&s.id!==currentStage.id).forEach(s=>{const sol=s.preShootSolution;if(!sol)return;s.targets.forEach(tt=>{const act=n(tt.actualHold),lo=n(tt.kMin),hi=n(tt.kMax),ps=sol.targets?.find(x=>x.targetId===tt.id||x.label===tt.label);if(act!==null&&lo!==null&&hi!==null){total++;const sideOK=!ps?.side||tt.holdSide===ps.side;if(sideOK&&act>=Math.min(lo,hi)&&act<=Math.max(lo,hi))inside++}if(ps&&ps.hold!==null&&act!==null){const aa=(tt.holdSide==="R"?1:-1)*act,pp=(ps.side==="R"?1:-1)*ps.hold;errs.push(aa-pp)}})});
 if(!total&&!errs.length)return null;return {total,inside,bias:errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null};
}
function matchLearningHTML(s){const x=matchLearningStats(s);if(!x)return `<div class="note">MATCH LEARNING: no completed stages yet.</div>`;return `<div class="note"><strong>MATCH LEARNING</strong><br>${x.total?`${x.inside}/${x.total} previous actual holds were inside their predicted bracket.`:""}${x.bias!==null?` Average actual hold has been ${x.bias>=0?"+":""}${x.bias.toFixed(1)} mil versus recommendation.`:""}<br><span class="small">Advisory only; it does not silently change this solution.</span></div>`}
function inferActualCondition(stage,tt){const act=n(tt.actualHold),lo=n(tt.kMin),hi=n(tt.kMax);if(act===null||lo===null||hi===null||hi===lo||!stage.preShootSolution)return null;const ps=stage.preShootSolution.targets?.find(x=>x.targetId===tt.id||x.label===tt.label);if(!ps)return null;const windLow=n(stage.wind?.min),windHigh=n(stage.wind?.max),windBest=n(stage.wind?.avg);if(windLow===null||windHigh===null||windHigh===windLow)return null;const pos=(act-lo)/(hi-lo),env=windLow+pos*(windHigh-windLow),sideOK=!ps.side||tt.holdSide===ps.side;if(!sideOK)return {confidence:"LOW",reason:"Final working hold is on the opposite side from the frozen pre-shoot prediction; a unique wind inference is not defensible."};return {envAtModeledAngle:env,modeledAngle:ps.fusedGlobalDir??null,confidence:(pos>=0&&pos<=1)?"MODERATE":"LOW",reason:null}}
function renderPost(s){
 live.innerHTML=`<div class="cardhead"><div><h3>Post-stage</h3><div class="small">Record the final working hold and score</div></div><span class="tag done">LEARNING</span></div>
 ${s.targets.map((tt,i)=>{const est=inferActualCondition(s,tt);return `<div class="targetCard"><div class="targetHeader"><strong>${esc(tt.label)} • ${esc(tt.distanceM)} m</strong><span class="tag ready">TARGET ${i+1}</span></div>
 
 <div class="grid two">${f("Final working hold","act_"+i,tt.actualHold,"decimal")}<label>Side<select id="side_${i}"><option ${tt.holdSide==="L"?"selected":""}>L</option><option ${tt.holdSide==="R"?"selected":""}>R</option></select></label><label>Working hold quality<select id="holdQ_${i}"><option ${tt.holdQuality==="Unknown"?"selected":""}>Unknown</option><option ${tt.holdQuality==="Approximate"?"selected":""}>Approximate</option><option ${tt.holdQuality==="Confirmed"?"selected":""}>Confirmed</option></select></label></div>
 ${tt.missOffset?`<div class="note">Recorded impact correction: ${hold1(tt.missOffset)} mil ${tt.missSide}.</div>`:""}
 ${est?est.reason?`<div class="warn"><strong>INFERRED WIND</strong><br>${esc(est.reason)}</div>`:`<div class="note"><strong>INFERRED CONDITION — ESTIMATE ONLY</strong><br>At the frozen pre-shoot direction ${est.modeledAngle!=null?Math.round(est.modeledAngle)+"°":"—"}: approximately ${est.envAtModeledAngle.toFixed(1)} mph environmental wind equivalent • Confidence ${est.confidence}.<br><span class="small">This does not uniquely reconstruct the downrange wind field.</span></div>`:""}</div>`}).join("")}
 <div class="actions"><button class="btn outline" id="inferBtn">CALCULATE INFERRED WIND</button></div>
 <div class="grid two">${f("Score / impacts","score",s.score,"numeric")}${f("Points possible","pts",s.pointsAvailable,"numeric")}</div>
 ${ta("Stage notes","postNotes",s.postNotes)}
 <div id="postMsg"></div><div class="actions"><button class="btn" id="completeStage">MARK STAGE COMPLETE</button></div>`;
 bindAuto(captureLive);
 inferBtn.onclick=()=>{captureLive();renderPost(s)};
 completeStage.textContent=s.correctionMode?"SAVE CORRECTION":"MARK STAGE COMPLETE";
 completeStage.onclick=()=>{captureLive();if(!validPost(s))return;if(!s.preShootSnapshot){alert("Pre-shoot snapshot missing. Return to FIRE before completing this stage.");return;}const wasCorrection=!!s.completedAt;if(!s.completedAt)s.completedAt=iso();else s.correctedAt=iso();s.correctionMode=false;flushCalypsoTelemetry();s.calypsoTelemetryStored=true;s.postStageSnapshot={createdAt:iso(),data:JSON.parse(JSON.stringify(s))};const mm=st.data.matches.find(x=>x.id===st.selectedMatch);if(wasCorrection&&mm?.completedAt){mm.revisionHistory=mm.revisionHistory||[];if(mm.finalSnapshot)mm.revisionHistory.push({createdAt:iso(),snapshot:mm.finalSnapshot});mm.correctedAt=iso();const copy=JSON.parse(JSON.stringify(mm));delete copy.finalSnapshot;mm.finalSnapshot=copy;}writeNow();st.screen="matchDashboard";render()};
}
function validPost(s){
 let sc=n(s.score),pa=n(s.pointsAvailable),msg=[];
 if(sc!==null&&pa!==null&&(sc<0||sc>pa))msg.push("Score / impacts must be between 0 and points possible.");
 postMsg.innerHTML=msg.length?`<div class="bad">${msg.join(" ")}</div>`:"";
 return !msg.length;
}
function captureLive(){
 let s=getStage();if(!s)return;
 if(st.liveStep===0)s.targets.forEach((tt,i)=>tt.dof=angleValue(v("dof_"+i)));
 if(st.liveStep===1){
   s.wind.min=whole(v("wmin"));s.wind.avg=whole(v("wavg"));s.wind.max=whole(v("wmax"));s.wind.now=whole(v("wnow"));
   s.wind.avgDir=angleValue(v("wdir"));s.wind.nowDir=String(v("wndir")).trim()===""?"":angleValue(v("wndir"));
   s.wind.window=v("wwin");s.wind.terrain=v("wterrain")||"Open / normal";
 }
 if(st.liveStep===2){
   s.points.forEach((p,pi)=>{
     p.distanceM=v("pd_"+pi)||p.distanceM;p.terrain=v("pt_"+pi)||p.terrain;
     p.obs.forEach((o,oi)=>{o.indicator=v(`oi_point_${pi}_${oi}`)||o.indicator;o.behavior=+(v(`ob_point_${pi}_${oi}`)||o.behavior||0);o.quality=v(`oq_point_${pi}_${oi}`)||o.quality;if(o.quality!=="Unknown"&&document.getElementById(`od_point_${pi}_${oi}`))o.dir=angleValue(v(`od_point_${pi}_${oi}`))})
   });
   if(document.getElementById("targetTerrain"))s.targetTerrain=v("targetTerrain")||s.targetTerrain||"Open / normal";
   s.targetObs.forEach((o,oi)=>{o.indicator=v(`oi_target_0_${oi}`)||o.indicator;o.behavior=+(v(`ob_target_0_${oi}`)||o.behavior||0);o.quality=v(`oq_target_0_${oi}`)||o.quality;if(o.quality!=="Unknown"&&document.getElementById(`od_target_0_${oi}`))o.dir=angleValue(v(`od_target_0_${oi}`))});
   s.intel.forEach((x,i)=>{if(document.getElementById("intelT_"+i))x.target=v("intelT_"+i);if(document.getElementById("intelH_"+i))x.hold=normDec(v("intelH_"+i))});
 }
 if(st.liveStep===3)s.targets.forEach((tt,i)=>{tt.kMin=normDec(v("kmin_"+i));tt.kMax=normDec(v("kmax_"+i))});
 if(st.liveStep===5){
   s.targets.forEach((tt,i)=>{tt.actualHold=normDec(v("act_"+i));tt.holdSide=v("side_"+i);tt.holdQuality=v("holdQ_"+i)||tt.holdQuality||"Unknown"});
   s.score=v("score");s.pointsAvailable=v("pts");s.postNotes=v("postNotes");
 }
 s.lastModifiedAt=iso();autosave();
}
function whole(x){let z=n(x);return z===null?"":String(Math.round(z))}
function getStage(){let m=st.data.matches.find(x=>x.id===st.selectedMatch);return m?.stages.find(x=>x.id===st.selectedStage)}


function unwrapAngles(values){
 if(!values.length)return [];const out=[values[0]];
 for(let i=1;i<values.length;i++){let x=values[i],prev=out[i-1];while(x-prev>180)x-=360;while(x-prev<-180)x+=360;out.push(x)}
 return out;
}

function svgLine(values,minV,maxV,label){const w=600,h=160,p=24;if(!values.length)return `<div class="note">No ${label} data yet.</div>`;if(maxV===minV)maxV=minV+1;const pts=values.map((vv,i)=>{const x=p+(w-2*p)*(values.length===1?.5:i/(values.length-1)),y=h-p-(h-2*p)*(vv-minV)/(maxV-minV);return `${x.toFixed(1)},${y.toFixed(1)}`}).join(" ");return `<svg class="reportChart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#009abf" stroke-width="4"/></svg><div class="reportLegend">${label}: ${values.map(vv=>Number(vv).toFixed(1)).join(" • ")}</div>`}
function reportStageCapture(s){let total=0,inside=0;const sol=s.preShootSolution;(s.targets||[]).forEach(tt=>{const a=n(tt.actualHold),lo=n(tt.kMin),hi=n(tt.kMax),ps=sol?.targets?.find(x=>x.targetId===tt.id||x.label===tt.label);if(a!==null&&lo!==null&&hi!==null){total++;const sideOK=!ps?.side||tt.holdSide===ps.side;if(sideOK&&a>=Math.min(lo,hi)&&a<=Math.max(lo,hi))inside++}});return {total,inside,pct:total?100*inside/total:null}}
function reports(){setBottom(false);const matches=st.data.matches.filter(m=>!m.archivedAt);main.innerHTML=`<div class="panel"><div class="kicker">Match analytics</div><h2>Reports</h2><div id="rep"></div></div>`;if(!matches.length){rep.innerHTML=`<div class="note">No match history yet.</div>`;return}rep.innerHTML=matches.slice().reverse().map(m=>{const done=m.stages.filter(s=>s.completedAt),score=done.reduce((x,s)=>x+(n(s.score)||0),0),avail=done.reduce((x,s)=>x+(n(s.pointsAvailable)||0),0);let bt=0,bi=0,errs=[];done.forEach(s=>{const c=reportStageCapture(s);bt+=c.total;bi+=c.inside;const sol=s.preShootSolution;if(sol)s.targets.forEach(tt=>{const ps=sol.targets?.find(x=>x.targetId===tt.id||x.label===tt.label),aa=n(tt.actualHold);if(ps&&aa!==null&&ps.hold!==null){const as=(tt.holdSide==="R"?1:-1)*aa,pr=(ps.side==="R"?1:-1)*ps.hold;errs.push(Math.abs(as-pr))}})});const cap=bt?100*bi/bt:null,mae=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null,windAvg=done.map(s=>n(s.wind?.avg)).filter(x=>x!==null),windDir=done.map(s=>n(s.wind?.avgDir)).filter(x=>x!==null),windDirPlot=unwrapAngles(windDir),stagePct=done.map(s=>n(s.pointsAvailable)>0?100*n(s.score)/n(s.pointsAvailable):0);return `<div class="card"><div class="cardhead"><div><strong>${esc(m.name)}</strong><div class="small">${done.length}/${m.stages.length} stages complete</div></div><span class="tag done">${avail?(100*score/avail).toFixed(1)+"%":"—"}</span></div><div class="grid four"><div><div class="small">TOTAL POINTS</div><div class="metric">${score}/${avail||"—"}</div></div><div><div class="small">WIND BRACKET CAPTURE</div><div class="metric">${cap!==null?cap.toFixed(0)+"%":"—"}</div></div><div><div class="small">MEAN HOLD ERROR</div><div class="metric">${mae!==null?mae.toFixed(1):"—"}</div><div class="small">mil</div></div><div><div class="small">AVG WIND</div><div class="metric">${windAvg.length?(windAvg.reduce((a,b)=>a+b,0)/windAvg.length).toFixed(1):"—"}</div><div class="small">mph</div></div></div><div class="note"><strong>WIND BRACKET CAPTURE</strong> = percentage of actual working holds that fell inside the pre-stage MIN–MAX solver hold bracket.</div><h3 style="margin-top:18px">Wind Speed Through Match</h3>${svgLine(windAvg,windAvg.length?Math.min(...windAvg):0,windAvg.length?Math.max(...windAvg):1,"AVG mph")}<h3 style="margin-top:18px">Wind Direction Through Match</h3>${svgLine(windDirPlot,windDirPlot.length?Math.min(...windDirPlot):0,windDirPlot.length?Math.max(...windDirPlot):360,"WIND FROM ° (unwrapped for continuity)")}<h3 style="margin-top:18px">Stage Score %</h3>${svgLine(stagePct,0,100,"Stage %")}<div class="matchSectionTitle">Stage Summary</div>${done.map(s=>{const c=reportStageCapture(s);return `<div class="listrow"><span>${esc(s.name)} • ${esc(s.wind?.avg||"—")} mph @ ${esc(s.wind?.avgDir||"—")}°</span><strong>${esc(s.score||"—")}/${esc(s.pointsAvailable||"—")} ${c.pct!==null?`• bracket ${c.pct.toFixed(0)}%`:""}</strong></div>`}).join("")||`<div class="note">No completed stages.</div>`}</div>`}).join("")}
function openWheelField(id,title){let el=document.getElementById(id);wheelCtx={type:"field",id,title};openWheel(el?.value||0,title)}
function openObsWheel(where,pi,oi){captureLive();let s=getStage();s.downrangeOpen=where==="target"?"target":"points";let o=where==="target"?s.targetObs[oi]:s.points[pi].obs[oi];wheelCtx={type:"obs",where,pi,oi,title:"INDICATOR MOVING TO"};openWheel(o.dir||0,"INDICATOR MOVING TO")}
function openWheel(val,title){wheelTitle.textContent=title;setTimeout(positionTicks,0);document.body.classList.add("modal-open");overlay.classList.remove("hidden");setWheel(n(val)||0)}
function closeWheel(commit=true){
 if(commit&&wheelCtx){
  let val=String(Math.round(n(wheelInput.value)||0));
  if(wheelCtx.type==="field"){let el=document.getElementById(wheelCtx.id);if(el){el.value=val;el.dispatchEvent(new Event("input",{bubbles:true}));captureLive();writeNow()}}
  else{let s=getStage();s.downrangeOpen=wheelCtx.where==="target"?"target":"points";let o=wheelCtx.where==="target"?s.targetObs[wheelCtx.oi]:s.points[wheelCtx.pi].obs[wheelCtx.oi];o.dir=angleValue(val);writeNow();if(st.liveStep===2)renderFastDownrange(s)}
 }
 overlay.classList.add("hidden");document.body.classList.remove("modal-open");wheelCtx=null
}
function setWheel(vv){let d=norm(vv);pointer.style.transform=`rotate(${d}deg)`;wheelDeg.textContent=String(Math.round(d)).padStart(3,"0")+"°";wheelClock.textContent=clock(d);wheelInput.value=String(Math.round(d))}
function evtAngle(e){e.preventDefault();let r=wheel.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.atan2(x,-y)*180/Math.PI;if(d<0)d+=360;setWheel(d)}
wheel.addEventListener("pointerdown",e=>{e.preventDefault();drag=true;wheel.setPointerCapture(e.pointerId);evtAngle(e)},{passive:false});
wheel.addEventListener("pointermove",e=>{if(drag)evtAngle(e)},{passive:false});
wheel.addEventListener("pointerup",e=>{drag=false;e.preventDefault()},{passive:false});
wheel.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
sheet.addEventListener("touchmove",e=>{if(e.target.closest(".wheel"))e.preventDefault()},{passive:false});
overlay.addEventListener("touchmove",e=>{if(e.target===overlay)e.preventDefault()},{passive:false});
wheelInput.addEventListener("input",()=>setWheel(n(wheelInput.value)||0));wheelDone.onclick=()=>closeWheel(true);
function positionTicks(){const size=wheel.clientWidth,c=size/2,r=size*.413;[...wheel.querySelectorAll(".tick")].forEach((el,idx)=>{let deg=(idx+1)*30,rad=(deg-90)*Math.PI/180;el.style.left=(c+r*Math.cos(rad))+"px";el.style.top=(c+r*Math.sin(rad))+"px"})}
for(let h=1;h<=12;h++){let el=document.createElement("div");el.className="tick";el.textContent=h;wheel.appendChild(el)}
window.addEventListener("resize",positionTicks);setTimeout(positionTicks,0);

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}
safeRead();render();hydrateFromIDB();
</script>
