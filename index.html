<body>
<div class="app">
<header>
<div class="brandrow">
  <div style="display:flex;align-items:center;gap:10px"><img src="wind-sight-icon.png" alt="WIND SIGHT PRS" style="width:42px;height:42px;border-radius:10px"><div class="brand"><span style="color:#d9dee7">WIND</span> <span style="color:#009abf">SIGHT</span> <span style="font-size:12px;letter-spacing:.16em;color:#a7b4c3">PRS</span><small>MATCH WIND INTELLIGENCE</small></div></div>
  <div class="save" id="saveState">Saved</div>
</div>
<nav id="nav"></nav>
</header>
<main id="main"></main>
</div>
<div class="bottom" id="bottom"><div class="bottomin"><button class="bigbtn" id="backBtn">← BACK</button><button class="bigbtn primary" id="nextBtn">NEXT →</button></div></div>

<div id="overlay" class="overlay hidden">
  <div class="sheet" id="sheet">
    <div class="cardhead"><div><div class="kicker">Angle tool</div><h2 id="wheelTitle">WIND FROM</h2></div><button class="btn secondary small" id="wheelDone">DONE</button></div>
    <div id="wheelDeg" class="wheelValue">000°</div><div id="wheelClock" class="wheelSub">12:00</div>
    <div class="wheelwrap"><div id="wheel" class="wheel"><div id="pointer" class="pointer"></div><div class="dot"></div></div></div>
    <label>Exact degrees<input id="wheelInput" type="text" inputmode="numeric"></label>
    <div class="note"><strong>Convention:</strong> WIND FROM for wind direction. TARGET DOF for target geometry.</div>
  </div>
</div>

<script>
const SCHEMA_VERSION=4, DBKEY="windSightPRS";
const MAX_TARGETS=10,MAX_POINTS=3,MAX_OBS=3,MAX_INTEL=5;
const LEGACY_KEYS=["windSightPRS_v24","prsWindPlatformV21","prsWindPlatformPrototypeV2"];
let st={screen:"home",step:0,selectedRifle:null,selectedAmmo:null,selectedMatch:null,selectedStage:null,liveStep:0,data:{schemaVersion:SCHEMA_VERSION,rifles:[],matches:[],drafts:{}}};
let saveTimer=null,wheelCtx=null,drag=false;

const IDB_NAME="windSightPRSDB",IDB_STORE="state",IDB_KEY="appData";
function idbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbPut(data){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(data,IDB_KEY);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function idbGet(){const db=await idbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readonly'),rq=tx.objectStore(IDB_STORE).get(IDB_KEY);rq.onsuccess=()=>resolve(rq.result||null);rq.onerror=()=>reject(rq.error)})}
async function hydrateFromIDB(){try{const d=await idbGet();if(!d)return;const localTs=Date.parse(st.data.lastSavedAt||0)||0,idbTs=Date.parse(d.lastSavedAt||0)||0;if(idbTs>localTs){st.data=migrateData(d);try{localStorage.setItem(DBKEY,JSON.stringify(st.data))}catch(e){}render();saveState.textContent='Recovered ✓'}}catch(e){}}

const iso=()=>new Date().toISOString(), uid=p=>p+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const normDec=x=>String(x??"").replace(",",".").trim();
const n=x=>{const raw=normDec(x);if(raw==="")return null;const v=Number(raw);return Number.isFinite(v)?v:null};
function norm(a){a=Number(a);return ((a%360)+360)%360}
function sdelta(a,b){return ((norm(a)-norm(b)+540)%360)-180}
function clock(deg){deg=norm(deg);let total=deg/360*720,mins=Math.round(total)%60,hr=Math.floor(total/60);if(hr===0)hr=12;if(hr>12)hr-=12;return hr+":"+String(mins).padStart(2,"0")}
function migrateData(d){
 if(!d||typeof d!=="object")return {schemaVersion:SCHEMA_VERSION,rifles:[],matches:[]};
 d.schemaVersion=d.schemaVersion||1;
 d.rifles=d.rifles||[]; d.matches=d.matches||[]; d.drafts=d.drafts||{}; d.trash=d.trash||{matches:[]}; d.trash.matches=d.trash.matches||[]; d.lastSavedAt=d.lastSavedAt||null;
 d.matches.forEach(m=>{
   m.stages=m.stages||[];
   m.stages.forEach(s=>{
     s.wind=s.wind||{min:"",avg:"",max:"",now:"",avgDir:"",nowDir:"",window:"10 min"};
     s.points=s.points||[{id:uid("p"),distanceM:"",terrain:"Open / normal",obs:[]}];
     s.targetObs=s.targetObs||[]; s.intel=s.intel||[];
     s.matchIntel=s.matchIntel||null; s.revisionHistory=s.revisionHistory||[];
     s.targets=(s.targets||[]).map(t=>({...t,holdSide:t.holdSide||"L"}));
   });
 });
 d.schemaVersion=SCHEMA_VERSION;
 return d;
}
function safeRead(){
 try{
   let raw=localStorage.getItem(DBKEY);
   if(!raw){
     for(const k of LEGACY_KEYS){raw=localStorage.getItem(k); if(raw)break;}
   }
   if(raw){st.data=migrateData(JSON.parse(raw)); localStorage.setItem(DBKEY,JSON.stringify(st.data));}
 }catch(e){console.error(e)}
}
async function writeNow(){
 st.data.lastSavedAt=iso();let localOK=false,idbOK=false;
 try{localStorage.setItem(DBKEY,JSON.stringify(st.data));localOK=!!localStorage.getItem(DBKEY)}catch(e){}
 try{idbOK=await idbPut(JSON.parse(JSON.stringify(st.data)))}catch(e){}
 saveState.textContent=(localOK||idbOK)?"Saved ✓ "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}):"SAVE FAILED";
 return localOK||idbOK;
}
function autosave(){saveState.textContent="Saving…";clearTimeout(saveTimer);saveTimer=setTimeout(writeNow,350)}

function saveDraft(kind,obj){st.data.drafts=st.data.drafts||{};st.data.drafts[kind]=JSON.parse(JSON.stringify(obj));autosave()}
function loadDraft(kind){return st.data.drafts?.[kind]?JSON.parse(JSON.stringify(st.data.drafts[kind])):null}
function clearDraft(kind){if(st.data.drafts)delete st.data.drafts[kind];autosave()}


function exportData(){
 const blob=new Blob([JSON.stringify(st.data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="wind-sight-prs-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function validBackupShape(d){return !!(d&&typeof d==='object'&&Array.isArray(d.rifles)&&Array.isArray(d.matches))}
function importData(e){
 const file=e.target.files?.[0];if(!file)return;
 const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);if(!validBackupShape(parsed))throw new Error('shape');const d=migrateData(parsed);st.data=d;writeNow();render();alert("Data imported successfully.")}catch(err){alert("Invalid WIND SIGHT PRS backup file.")}};rd.readAsText(file);
}

function navItems(){return [["home","HOME"],["matches","MATCHES"],["rifles","PROFILES"],["reports","REPORTS"]]}
function renderNav(){nav.innerHTML="";navItems().forEach(([k,l])=>{let b=document.createElement("button");b.className="navbtn"+(st.screen===k?" active":"");b.textContent=l;b.onclick=()=>{saveCurrent();st.screen=k;st.step=0;render()};nav.appendChild(b)})}
function setBottom(show=true,nextLabel="NEXT →",nextVisible=true){bottom.style.display=show?"block":"none";nextBtn.textContent=nextLabel;nextBtn.style.visibility=nextVisible?"visible":"hidden"}
function render(){renderNav();main.innerHTML="";({home,rifles,rifleWizard,matches,matchWizard,matchDashboard,liveStage,reports}[st.screen]||home)();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:"auto"}))}
function saveCurrent(){try{if(st.screen==="liveStage")captureLive()}catch(e){}autosave()}
function f(lbl,id,val,mode="text"){let im=mode==="numeric"?"numeric":mode==="decimal"?"decimal":"text",type=mode==="date"?"date":"text";return `<label>${lbl}<input id="${id}" type="${type}" inputmode="${im}" autocomplete="off" value="${esc(val??"")}"></label>`}
function ta(lbl,id,val){return `<label>${lbl}<textarea id="${id}">${esc(val??"")}</textarea></label>`}
function v(id){return document.getElementById(id)?.value??""}
function bindAuto(cb){main.querySelectorAll("input,select,textarea").forEach(el=>{el.addEventListener("input",cb);el.addEventListener("change",cb)})}

function hasReadyProfile(){return st.data.rifles.some(r=>(r.ammo||[]).some(a=>a.name&&a.bullet&&n(a.mv)>0&&(a.bcType||a.bc)));}
function home(){
 setBottom(false);const recentMatches=st.data.matches.filter(m=>!m.archivedAt).slice().reverse().slice(0,4);
 main.innerHTML=`<div class="panel"><div class="kicker">Fast match access</div><h2>WIND SIGHT PRS</h2><p class="sub">${hasReadyProfile()?"Open a match or start a new one.":"Set up your first rifle + ammo combo before creating a match."}</p><div class="actions">${hasReadyProfile()?`<button class="btn" id="newMatch">+ NEW MATCH</button>`:`<button class="btn" id="setupFirst">SET UP FIRST COMBO →</button>`}<button class="btn secondary" id="profilesBtn">PROFILES</button></div></div><div class="panel"><div class="cardhead"><h3>Recent Matches</h3><button class="btn outline small" id="allMatches">VIEW ALL</button></div><div id="recent">${recentMatches.length?recentMatches.map(m=>`<button class="matchCardBtn recentOpen" data-m="${m.id}"><strong>${esc(m.name)}</strong><span class="small">${esc(m.date||"")} • ${m.stages?.length||0} stages • ${m.completedAt?"Complete":"Active"}</span></button>`).join(""):`<div class="note">No matches yet.</div>`}</div></div><div class="publisherFooter"><div class="small">PRODUCT PUBLISHER</div><img src="zealtech-transparent.png" alt="ZealTech"></div>`;
 document.getElementById("setupFirst")?.addEventListener("click",()=>{st.screen="rifleWizard";st.step=0;st.selectedRifle=null;st.selectedAmmo=null;render()});document.getElementById("newMatch")?.addEventListener("click",()=>{st.screen="matchWizard";st.step=0;st.selectedMatch=null;render()});profilesBtn.onclick=()=>{st.screen="rifles";render()};allMatches.onclick=()=>{st.screen="matches";render()};document.querySelectorAll(".recentOpen").forEach(b=>b.onclick=()=>{st.selectedMatch=b.dataset.m;st.screen="matchDashboard";render()});

function profileCombos(){const out=[];st.data.rifles.forEach(r=>(r.ammo||[]).forEach(a=>out.push({r,a})));return out}
function deleteCombo(rid,aid){const r=st.data.rifles.find(x=>x.id===rid);if(!r)return;const a=r.ammo.find(x=>x.id===aid);if(!a)return;if(!confirm(`Delete profile "${r.name} + ${a.name}"?`))return;if(!confirm("Delete permanently? Historical matches keep their frozen snapshots."))return;r.ammo=r.ammo.filter(x=>x.id!==aid);if(!r.ammo.length)st.data.rifles=st.data.rifles.filter(x=>x.id!==rid);writeNow();render()}
function rifles(){setBottom(false);const combos=profileCombos();main.innerHTML=`<div class="panel"><div class="cardhead"><div><div class="kicker">Rifle + ammo combos</div><h2>Profiles</h2></div><button class="btn" id="addCombo">+ NEW COMBO</button></div>${combos.length?combos.map(({r,a})=>`<div class="comboCard" data-r="${r.id}" data-a="${a.id}"><div class="comboTitle">${esc(r.name)} + ${esc(a.name)}</div><div class="comboMeta">${esc(r.cartridge||"")} • ${esc(a.bullet||"")} • ${esc(a.mv||"—")} ${esc(a.mvUnit||"fps")} • ${esc(a.bcType||"G7")} ${esc(a.bcValue||a.bc||"—")}<br>${a.currentCalibrationVersion?`Calibration v${a.currentCalibrationVersion} ✓`:`Calibration incomplete`}</div><div class="actions"><button class="btn secondary small editCombo">VIEW / EDIT</button><button class="btn danger small deleteCombo">DELETE PROFILE</button></div></div>`).join(""):`<div class="note">No rifle + ammo combos yet.</div>`}</div>`;addCombo.onclick=()=>{st.screen="rifleWizard";st.step=0;st.selectedRifle=null;st.selectedAmmo=null;render()};document.querySelectorAll(".comboCard").forEach(el=>{el.querySelector(".editCombo").onclick=()=>{st.selectedRifle=el.dataset.r;st.selectedAmmo=el.dataset.a;st.step=0;st.screen="rifleWizard";render()};el.querySelector(".deleteCombo").onclick=()=>deleteCombo(el.dataset.r,el.dataset.a)});}

     <label>Ballistic software<select id="rKestrel"><option ${r.kestrelModel==="Kestrel / Applied Ballistics"||r.kestrelModel==="5700 Elite"?"selected":""}>Kestrel / Applied Ballistics</option><option ${r.kestrelModel==="Applied Ballistics App"?"selected":""}>Applied Ballistics App</option><option ${r.kestrelModel==="Hornady 4DOF"?"selected":""}>Hornady 4DOF</option><option ${r.kestrelModel==="GeoBallistics"?"selected":""}>GeoBallistics</option><option ${r.kestrelModel==="Shooter"?"selected":""}>Shooter</option><option ${r.kestrelModel==="Other / Custom"?"selected":""}>Other / Custom</option></select></label>
     ${ta("Notes","rNotes",r.notes)}

     ${f("Bullet / model","aBullet",a.bullet)}

     <label>BC model<select id="aBcType"><option ${a.bcType==="G1"?"":"selected"}>G7</option><option ${a.bcType==="G1"?"selected":""}>G1</option><option ${a.bcType==="Custom Drag Model"?"selected":""}>Custom Drag Model</option></select></label>${f("BC value / CDM reference","aBc",a.bcValue||a.bc)}<div class="dimensionNote">For G1/G7 enter a decimal between 0 and 1, e.g. 0.290.</div>
     ${f("Lot / batch","aLot",a.lot)}
     ${ta("Ammo notes","aNotes",a.notes)}
   </div><div class="note">Calibration belongs to this rifle + ammo combination.</div>`;
 }else if(st.step===2){
   rw.innerHTML=`<div class="calHelp"><strong>WIND SPEED CALIBRATION</strong><br>Purpose: teach WIND SIGHT how this rifle + ammo responds as wind speed changes.<br><br><strong>On your Kestrel:</strong> set DOF = 000°, inclination = 0°, and WIND FROM = 90° (full-value crosswind). Keep the same rifle profile and atmosphere. At every distance shown below, set 5 mph, 10 mph and 15 mph and copy the Kestrel wind hold in mil into the table.</div>`+calTableA(a);
 }else if(st.step===3){
   rw.innerHTML=`<div class="calHelp"><strong>WIND ANGLE CALIBRATION</strong><br>Purpose: teach WIND SIGHT how the ballistic solution changes as the same wind approaches the bullet path from different angles.<br><br><strong>On your Kestrel:</strong> keep DOF = 000° and wind speed = 10 mph. For each WIND FROM angle (15°, 30°, 45°, 60°, 75°, 90°), copy the Kestrel hold at 500 m and 900 m.</div>`+calTableB(a);
 }else if(st.step===4){
   rw.innerHTML=`<div class="calHelp"><strong>TARGET DOF VALIDATION</strong><br>Purpose: verify WIND SIGHT and your Kestrel reference the same physical wind correctly when you pan between targets.<br><br><strong>On your Kestrel:</strong> set WD Chg = w/ DOF. Use a fixed 700 m target. Establish the physical stage wind as WIND FROM 90° at T1 / DOF 000°. Set WS1 = 8 mph and WS2 = 12 mph. Change only DOF. Enter the WD, Wnd1 and Wnd2 displayed by Kestrel.</div>`+calTableD(a);
 }else{
   rw.innerHTML=`<div class="card"><strong>${esc(r.name||"Unnamed rifle")}</strong><div class="small">${esc(r.cartridge||"")}</div></div>

 }
 bindAuto(()=>saveRifleWizard(r,a));
 if(document.getElementById("quickSaveRifle"))quickSaveRifle.onclick=()=>{saveRifleWizard(r,a);const ix=st.data.rifles.findIndex(x=>x.id===r.id);if(ix>=0)st.data.rifles[ix]=r;writeNow();st.screen="rifles";render()};
 backBtn.onclick=()=>{saveRifleWizard(r,a);if(st.step===0){st.screen="rifles";render()}else{st.step--;render()}};
 nextBtn.onclick=()=>{saveRifleWizard(r,a);if(st.step===1&&a&&["G1","G7"].includes(a.bcType)){const bc=n(a.bcValue);if(!(bc>0&&bc<1)){alert("BC value for G1/G7 must be between 0 and 1, e.g. 0.290.");return;}}if(st.step<last){st.step++;render()}else{commitRifleWizard(r,a);st.screen="rifles";st.step=0;render()}};
}
function saveRifleWizard(r,a){
 if(st.step===0){r.name=v("rName");r.cartridge=v("rCart");r.twistValue=v("rTwist");r.twist="1:"+v("rTwist");r.zeroM=v("rZero");r.sightHeight=v("rSight");r.sightHeightUnit=v("rSightUnit")||"cm";r.kestrelModel=v("rKestrel");r.notes=v("rNotes")}
 if(st.step===1&&a){a.name=v("aName");a.bullet=v("aBullet");a.weightGr=v("aWeight");a.mv=v("aMv");a.mvUnit=v("aMvUnit")||"fps";a.bcType=v("aBcType")||"G7";a.bcValue=v("aBc");a.bc=a.bcValue;a.lot=v("aLot");a.notes=v("aNotes")}
 if(st.step===2&&a){a._work.A=readCal("calA");a._work.meta.A.speeds=[n(v("aS1"))||5,n(v("aS2"))||10,n(v("aS3"))||15]}
 if(st.step===3&&a){a._work.B=readCal("calB");a._work.meta.B.speed=n(v("bSpeed"))||10;a._work.meta.B.distances=[n(v("bD1"))||500,n(v("bD2"))||900]}
 if(st.step===4&&a){a._work.D=readCal("calD");a._work.meta.D={distance:n(v("dDist"))||700,stageWindFrom:n(v("dWind"))||90,ws1:n(v("dWS1"))||8,ws2:n(v("dWS2"))||12}}
 if(r&&!st.selectedRifle)saveDraft("rifle",r);
 if(a&&!st.selectedAmmo)saveDraft("ammo",a);
 autosave();
}

function holdInput(value,side,id){return `<div class="holdCell"><input data-hold="${id}" inputmode="decimal" value="${esc(value??"")}"><select data-side="${id}"><option ${side==="L"?"selected":""}>L</option><option ${side==="R"?"selected":""}>R</option></select></div>`}
function ensureSideMeta(a){a._work.sides=a._work.sides||{A:{},B:{},D:{}}}
function currentWizardAmmo(){let r=st.selectedRifle?st.data.rifles.find(x=>x.id===st.selectedRifle):st._rd;return st.selectedAmmo?r?.ammo.find(x=>x.id===st.selectedAmmo):st._ad}
function readCalAdvanced(id,key,a){ensureSideMeta(a);return [...document.querySelectorAll(`#${id} tbody tr`)].map((tr,ri)=>{const axis=normDec(tr.querySelector('[data-axis]')?.value||'');const vals=[...tr.querySelectorAll('[data-hold]')].map((inp,ci)=>{a._work.sides[key][`${ri}_${ci}`]=tr.querySelector(`[data-side="${inp.dataset.hold}"]`)?.value||'R';return normDec(inp.value)});return [axis,...vals]})}
function calWarnings(a,key){const w=[];if(key==='A'){const rows=a._work.A||[];rows.forEach(r=>{const v=r.slice(1).map(n);for(let i=1;i<v.length;i++)if(v[i]!=null&&v[i-1]!=null&&v[i]+.001<v[i-1])w.push(`${r[0]} m: higher wind speed produced a lower hold`)})}if(key==='B'){const rows=(a._work.B||[]).slice().sort((x,y)=>n(x[0])-n(y[0]));if(rows.length)for(let c=1;c<rows[0].length;c++){let pr=null;rows.forEach(r=>{const x=n(r[c]);if(x!=null&&pr!=null&&x+.001<pr)w.push(`${r[0]}°: hold dropped as wind angle increased`);if(x!=null)pr=x})}}if(key==='D'){const meta=a._work.meta?.D||{stageWindFrom:90};(a._work.D||[]).forEach(r=>{const dof=n(r[0]),wd=n(r[1]),h1=n(r[2]),h2=n(r[3]);if(dof!=null&&wd!=null&&Math.abs(sdelta(wd,norm(meta.stageWindFrom-dof)))>8)w.push(`DOF ${dof}°: software WD differs from expected geometry`);if(h1!=null&&h2!=null&&h2+.001<h1)w.push(`DOF ${dof}°: higher wind speed produced lower hold`)})}return w}
function addCalRow(key){const a=currentWizardAmmo();if(!a)return;if(key==='A')a._work.A.push(['','','','']);if(key==='B')a._work.B.push(['','','']);if(key==='D')a._work.D.push(['','','','']);render()}
function removeCalRow(key,i){const a=currentWizardAmmo();if(!a)return;a._work[key].splice(i,1);render()}
function addBDistance(){const a=currentWizardAmmo();if(!a)return;const d=prompt('New calibration distance in meters');if(!(n(d)>0))return;a._work.meta.B.distances.push(n(d));a._work.B=a._work.B.map(r=>[...r,'']);render()}
function calibrationComplete(a){
 if(!a||!a._work)return false;
 const A=a._work.A||[],B=a._work.B||[],D=a._work.D||[];
 return A.length>=3&&A.every(r=>n(r[0])>0&&r.slice(1).every(x=>n(x)!==null)) && B.length>=3&&B.every(r=>n(r[0])!==null&&r.slice(1).every(x=>n(x)!==null)) && D.length>=3&&D.every(r=>angleOK(r[0])&&r.slice(1).every(x=>n(x)!==null));
}

function commitRifleWizard(r,a){
 if(a){
   if(!a.name){alert("Enter an ammo profile name.");return;}
   if(!r.ammo.find(x=>x.id===a.id))r.ammo.push(a);
   const data=JSON.parse(JSON.stringify(a._work||{A:[],B:[],D:[]}));
   const prev=a.calibrationVersions?.[a.calibrationVersions.length-1];
   if(calibrationComplete(a) && (!prev||JSON.stringify(prev.data)!==JSON.stringify(data))){
     a.currentCalibrationVersion=(a.currentCalibrationVersion||0)+1;
     a.calibrationVersions=a.calibrationVersions||[];
     a.calibrationVersions.push({version:a.currentCalibrationVersion,createdAt:iso(),data});
   }
 }
 const ix=st.data.rifles.findIndex(x=>x.id===r.id); if(ix>=0)st.data.rifles[ix]=r; else st.data.rifles.push(r);
 st._rd=null;st._ad=null;clearDraft("rifle");clearDraft("ammo");writeNow();
}
function calTableA(a){ensureSideMeta(a);let rows=a._work.A?.length?a._work.A:[[300,"","",""],[400,"","",""],[500,"","",""],[600,"","",""],[700,"","",""],[800,"","",""],[900,"","",""]],sp=a._work.meta?.A?.speeds||[5,10,15];const warn=calWarnings(a,'A');return `<div class="note"><strong>Enter your ballistic software's wind holds.</strong> Distances and wind speeds are customizable.</div><div class="grid three">${sp.map((x,i)=>f(`Wind ${i+1} mph`,`aS${i+1}`,x,'decimal')).join('')}</div><div class="calTableWrap"><table class="table" id="calA"><tbody>${rows.map((r,ri)=>`<tr><td><input data-axis inputmode="numeric" value="${esc(r[0])}"></td>${r.slice(1).map((x,ci)=>`<td>${holdInput(x,a._work.sides.A[`${ri}_${ci}`]||'R',`A_${ri}_${ci}`)}</td>`).join('')}<td><button class="btn danger small" type="button" onclick="removeCalRow('A',${ri})">×</button></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn secondary small" type="button" onclick="addCalRow('A')">+ ADD DISTANCE</button></div>${warn.length?`<div class="warn">CHECK: ${warn.join('<br>')}</div>`:`<div class="note">Validation: no obvious trend problem detected.</div>`}`}
function calTableB(a){ensureSideMeta(a);let rows=a._work.B?.length?a._work.B:[[15,"",""],[30,"",""],[45,"",""],[60,"",""],[75,"",""],[90,"",""]],meta=a._work.meta?.B||{speed:10,distances:[500,900]};const warn=calWarnings(a,'B');return `<div class="note"><strong>Enter your ballistic software's wind holds.</strong> Add angles and distances as needed.</div><div class="grid three">${f('Wind speed mph','bSpeed',meta.speed,'decimal')}${meta.distances.map((d,i)=>f(`Distance ${i+1} m`,`bD${i+1}`,d,'numeric')).join('')}</div><div class="calTableWrap"><table class="table" id="calB"><tbody>${rows.map((r,ri)=>`<tr><td><input data-axis inputmode="numeric" value="${esc(r[0])}"></td>${r.slice(1).map((x,ci)=>`<td>${holdInput(x,a._work.sides.B[`${ri}_${ci}`]||'R',`B_${ri}_${ci}`)}</td>`).join('')}<td><button class="btn danger small" type="button" onclick="removeCalRow('B',${ri})">×</button></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn secondary small" onclick="addCalRow('B')">+ ADD ANGLE</button><button class="btn outline small" onclick="addBDistance()">+ ADD DISTANCE</button></div>${warn.length?`<div class="warn">CHECK: ${warn.join('<br>')}</div>`:`<div class="note">Validation: no obvious trend problem detected.</div>`}`}
function calTableD(a){ensureSideMeta(a);let rows=a._work.D?.length?a._work.D:[[0,"","",""],[30,"","",""],[60,"","",""],[120,"","",""],[180,"","",""],[240,"","",""],[330,"","",""]],meta=a._work.meta?.D||{distance:700,stageWindFrom:90,ws1:8,ws2:12};const warn=calWarnings(a,'D');return `<div class="note"><strong>Enter the WD and holds shown by your ballistic software.</strong> Customize the fixed validation distance and DOFs.</div><div class="grid four">${f('Distance m','dDist',meta.distance,'numeric')}${f('Stage WIND FROM °','dWind',meta.stageWindFrom,'numeric')}${f('WS1 mph','dWS1',meta.ws1,'decimal')}${f('WS2 mph','dWS2',meta.ws2,'decimal')}</div><div class="calTableWrap"><table class="table" id="calD"><tbody>${rows.map((r,ri)=>`<tr><td><input data-axis inputmode="numeric" value="${esc(r[0])}"></td><td><input data-hold="DWD_${ri}" inputmode="numeric" value="${esc(r[1])}"></td><td>${holdInput(r[2],a._work.sides.D[`${ri}_0`]||'R',`D1_${ri}`)}</td><td>${holdInput(r[3],a._work.sides.D[`${ri}_1`]||'R',`D2_${ri}`)}</td><td><button class="btn danger small" onclick="removeCalRow('D',${ri})">×</button></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn secondary small" onclick="addCalRow('D')">+ ADD DOF</button></div>${warn.length?`<div class="warn">CHECK: ${warn.join('<br>')}</div>`:`<div class="note">Validation: no obvious trend problem detected.</div>`}`}
function readCal(id){return [...document.querySelectorAll(`#${id} tbody tr`)].map(tr=>[...tr.querySelectorAll('input')].map(i=>normDec(i.value)))}


function deepClone(x){return JSON.parse(JSON.stringify(x))}
function regenTargetIds(targets){return (targets||[]).map((t,i)=>({...deepClone(t),id:uid("t"),label:t.label||("T"+(i+1)),dof:"",kMin:"",kMax:"",actualHold:"",holdSide:"L"}))}
function duplicateStageRecord(s,index){
 const c=deepClone(s);
 c.id=uid("s");c.name=(s.name||("Stage "+(index+1)))+" Copy";c.createdAt=iso();c.liveStartedAt=null;c.completedAt=null;c.preShootSnapshot=null;c.preShootSolution=null;c.postStageSnapshot=null;c.revisionHistory=[];c.correctionMode=false;c.score="";c.postNotes="";
 c.targets=regenTargetIds(c.targets);
 c.points=(c.points||[]).map(p=>({...p,id:uid("p"),obs:(p.obs||[]).map(o=>({...o,id:uid("o")}))}));
 c.targetObs=(c.targetObs||[]).map(o=>({...o,id:uid("o")}));
 return c;
}
function duplicateMatchRecord(m){
 const c=deepClone(m);
 c.id=uid("m");c.name=(m.name||"Match")+" Copy";c.createdAt=iso();c.completedAt=null;c.finalSnapshot=null;c.revisionHistory=[];c.archivedAt=null;c.deletedAt=null;
 c.stages=(c.stages||[]).map((s,i)=>duplicateStageRecord(s,i));
 return c;
}
function archiveMatchById(id){
 const m=st.data.matches.find(x=>x.id===id);if(!m)return;
 m.archivedAt=iso();writeNow();render();
}
function restoreArchivedMatchById(id){
 const m=st.data.matches.find(x=>x.id===id);if(!m)return;

function fuse(s){
 let mi=n(s.wind.min),av=n(s.wind.avg),ma=n(s.wind.max),dir=n(s.wind.avgDir);
 if(mi===null||av===null||ma===null||dir===null||mi<0||av<0||ma<0||!(mi<=av&&av<=ma)||!angleOK(dir))return {valid:false,reason:"Enter valid non-negative Calypso MIN / AVG / MAX and AVG WIND FROM.",quality:"WEAK"};
 if(s.targets.some(t=>String(t.dof??"").trim()===""||n(t.dof)===null))return {valid:false,reason:"Enter a DOF for every target before continuing to Kestrel.",quality:"WEAK"};
 let low=mi,best=av,high=ma,conflicts=[],speedObs=[],dirObs=[],pathNotes=[];
 const zones=[...s.points.map((p,idx)=>({name:`Point ${idx+1}`,terrain:p.terrain,obs:p.obs})),{name:"Target zone",terrain:s.targetTerrain,obs:s.targetObs}];
 zones.forEach(z=>{
   const zr=[];
   (z.obs||[]).forEach(o=>{
     const b=behavior[o.indicator]?.[+o.behavior||0]; if(!b)return;
     const rr=rel(o.indicator);
     if(b[1]!=null)zr.push({lo:b[1],hi:b[2],mid:(b[1]+b[2])/2,rel:rr,source:o.indicator,zone:z.name});
     if(o.quality!=="Unknown"&&String(o.dir??"").trim()!==""){
       const dr=b[3].includes("direction")?Math.max(rr,.8):rr;
       dirObs.push({deg:norm((+o.dir)+180),rel:dr*(o.quality==="Clear"?1:.55),zone:z.name});
     }
   });
   if(zr.length>1){const il=Math.max(...zr.map(x=>x.lo)),ih=Math.min(...zr.map(x=>x.hi));if(il>ih)conflicts.push(`${z.name}: observations disagree.`)}
   if(zr.length){const zl=Math.min(...zr.map(x=>x.lo)),zh=Math.max(...zr.map(x=>x.hi));if(zh<mi)pathNotes.push(`${z.name}: observed wind appears weaker than shooter bracket.`);if(zl>ma)pathNotes.push(`${z.name}: observed wind appears stronger than shooter bracket.`)}speedObs.push(...zr);
 });
 let sw=3,sm=3*av;speedObs.forEach(e=>{sw+=e.rel;sm+=e.rel*e.mid});best=Math.max(low,Math.min(high,sm/sw));
 const nowSp=n(s.wind.now); if(nowSp!==null&&nowSp>=low&&nowSp<=high)best=Math.max(low,Math.min(high,best*.7+nowSp*.3));
 let vx=3*Math.cos(dir*Math.PI/180),vy=3*Math.sin(dir*Math.PI/180);
 dirObs.forEach(e=>{vx+=e.rel*Math.cos(e.deg*Math.PI/180);vy+=e.rel*Math.sin(e.deg*Math.PI/180)});
 const nowDir=n(s.wind.nowDir);if(nowDir!==null&&Math.abs(sdelta(nowDir,dir))<=35){vx+=1.2*Math.cos(nowDir*Math.PI/180);vy+=1.2*Math.sin(nowDir*Math.PI/180)}
 const dBest=norm(Math.atan2(vy,vx)*180/Math.PI);
 const terrainSet=[s.wind.terrain||"Open / normal",...s.points.map(p=>p.terrain),s.targetTerrain||"Open / normal"];
 const terrainComplex=terrainSet.filter(x=>["Sheltered","Ridge / exposed","Valley / channel","Turbulent / complex","Unknown"].includes(x)).length;
 let q="STRONG"; if(conflicts.length||speedObs.length===0||terrainComplex>0)q="MODERATE"; if(conflicts.length>1||terrainComplex>2)q="WEAK";
 const learned=learnedBias(s);const directionSamples=[dir,...dirObs.map(x=>x.deg)];if(nowDir!==null&&angleOK(nowDir))directionSamples.push(norm(nowDir));
 return {valid:true,low,best,high,dir:dBest,quality:q,conflicts,pathNotes,learnedBias:learned,directionSamples}
}
function learnedBias(currentStage){
 let m=st.data.matches.find(x=>x.id===st.selectedMatch);if(!m)return null;let now=Date.now(),vals=[];
 (m.stages||[]).filter(x=>x.completedAt&&x.id!==currentStage.id).forEach(s=>{
   let ageH=(now-new Date(s.completedAt).getTime())/36e5,wt=Math.exp(-ageH/2);
   s.targets.forEach(t=>{let a=n(t.actualHold),lo=n(t.kMin),hi=n(t.kMax);if(a!==null&&lo!==null&&hi!==null&&hi>lo){let pos=(a-lo)/(hi-lo)-.5;vals.push({bias:pos,wt})}})
 });
 if(!vals.length)return null;let sw=vals.reduce((x,y)=>x+y.wt,0),b=vals.reduce((x,y)=>x+y.bias*y.wt,0)/sw;return Math.max(-.5,Math.min(.5,b))*.5
}
function tWind(t,f){let rel=sdelta(f.dir,+t.dof||0),factor=Math.abs(Math.sin(rel*Math.PI/180));return {expectedWD:norm(f.dir-(+t.dof||0)),rel,factor,low:f.low*factor,best:f.best*factor,high:f.high*factor}}

function renderShoot(s){
 let fz=fuse(s);
 if(!fz.valid){live.innerHTML=`<div class="bad">${fz.reason}</div><div class="note">Go back to WIND / KESTREL and complete the required values.</div>`;return}
 let cards=s.targets.map(t=>shootHTML(t,fz)).join("");
 live.innerHTML=`<div class="cardhead"><div><h3>Shoot plan</h3><div class="small">Horizontal wind probability only</div></div><span class="tag live">${fz.quality}</span></div>${cards}<div class="card"><h3>Stage Card</h3><div class="stagecard">${s.targets.map(t=>stageLine(t,fz)).join("")}</div></div>`;
}
function widthMil(t){let d=n(t.distanceM),w=n(t.widthCm);return d&&w?((w/100)/d)*1000:null}
function triCDF(x,a,m,b){if(x<=a)return 0;if(x>=b)return 1;if(b<=a)return x>=b?1:0;if(m<=a+1e-9)return 1-Math.pow((b-x)/(b-a),2);if(m>=b-1e-9)return Math.pow((x-a)/(b-a),2);return x<=m?Math.pow(x-a,2)/((b-a)*(m-a)):1-Math.pow(b-x,2)/((b-a)*(b-m))}
function opt(t,f){let lo=n(t.kMin),hi=n(t.kMax),w=widthMil(t);if(lo===null||hi===null||hi<lo||!w)return null;let z=tWind(t,f),den=z.high-z.low,mode=den>1e-9?lo+(z.best-z.low)/den*(hi-lo):(lo+hi)/2;mode=Math.max(lo,Math.min(hi,mode));let bh=lo,bp=-1;for(let h=lo-w/2;h<=hi+w/2;h+=.001){let p=triCDF(h+w/2,lo,mode,hi)-triCDF(h-w/2,lo,mode,hi);if(p>bp){bp=p;bh=h}}let sl=hi-w/2,sh=lo+w/2;return {lo,hi,w,mode,bh,bp:Math.max(0,Math.min(1,bp)),safe:sl<=sh,sl,sh}}
function shootHTML(t,f){if(sideFlipForTarget(t,f))return `<div class="card critical"><div class="cardhead"><strong>${esc(t.label)} • ${esc(t.distanceM)} m</strong><span class="tag live">SIDE FLIP</span></div><div class="warn">Wind evidence crosses the bore line. Easy Mode will not issue a single-side optimal hold or P(hit). Recheck current direction and use the Solver bracket deliberately.</div></div>`;let r=opt(t,f);if(!r)return `<div class="note">${t.label}: enter valid Kestrel MIN/MAX holds and target width.</div>`;let ints=getStage().intel.filter(x=>x.target===t.label&&x.hold!=="").map(x=>n(x.hold)).filter(x=>x!==null),iw=ints.length&&(Math.max(...ints)<r.lo||Math.min(...ints)>r.hi);return `<div class="card"><div class="cardhead"><strong>${t.label} • ${t.distanceM} m</strong><span class="tag done">MODELLED WIND P(HIT)</span></div><div class="hero"><div class="small">OPTIMAL WIND HOLD</div><div class="big">${r.bh.toFixed(1)} ${tWind(t,f).rel>=0?"R":"L"}</div><div class="unit">mil</div></div><div class="listrow"><span>Solver bracket</span><strong>${r.lo.toFixed(2)}–${r.hi.toFixed(2)}</strong></div><div class="listrow"><span>MODELLED WIND P(HIT)</span><strong>${(r.bp*100).toFixed(0)}%</strong></div><div class="listrow"><span>Safe hold window</span><strong>${r.safe?r.sl.toFixed(2)+"–"+r.sh.toFixed(2):"NONE"}</strong></div>${ints.length?`<div class="${iw?"warn":"note"}">Shooter Intel: ${ints.map(x=>x.toFixed(2)).join(" / ")}${iw?" • outside model bracket":""}</div>`:""}<div class="small" style="margin-top:8px">Shape stored: ${esc(t.shape)}. Easy Mode probability is horizontal-wind-only; full 2D shape dispersion remains Advanced Mode.</div></div>`}
function stageLine(t,f){if(sideFlipForTarget(t,f))return `<div class="stageLine"><strong>${t.label} • ${t.distanceM} m</strong><div class="hold">FLIP</div><div class="meta">Recheck wind side / Kestrel</div></div>`;let r=opt(t,f);return `<div class="stageLine"><strong>${t.label} • ${t.distanceM} m</strong><div class="hold">${r?r.bh.toFixed(1)+" "+(tWind(t,f).rel>=0?"R":"L"):"—"}</div><div class="meta">${r?`Bracket ${r.lo.toFixed(2)}–${r.hi.toFixed(2)} • P(hit) ${(r.bp*100).toFixed(0)}%`:"Solver holds required"}</div></div>`}

function matchLearningStats(currentStage){const m=st.data.matches.find(x=>x.id===st.selectedMatch);if(!m)return null;let total=0,inside=0,errs=[];(m.stages||[]).filter(s=>s.completedAt&&s.id!==currentStage.id).forEach(s=>{const sol=s.preShootSolution;if(!sol)return;s.targets.forEach(tt=>{const act=n(tt.actualHold),lo=n(tt.kMin),hi=n(tt.kMax),ps=sol.targets?.find(x=>x.targetId===tt.id||x.label===tt.label);if(act!==null&&lo!==null&&hi!==null){total++;if(act>=lo&&act<=hi)inside++}if(ps&&ps.recommendedHold!==null&&act!==null){const aa=(tt.holdSide==="R"?1:-1)*act,pp=(ps.recommendedSide==="R"?1:-1)*ps.recommendedHold;errs.push(aa-pp)}})});if(!total&&!errs.length)return null;return {total,inside,bias:errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null}}
function matchLearningHTML(s){const x=matchLearningStats(s);if(!x)return `<div class="note">MATCH LEARNING: no completed stages yet.</div>`;return `<div class="note"><strong>MATCH LEARNING</strong><br>${x.total?`${x.inside}/${x.total} previous actual holds were inside their predicted bracket.`:""}${x.bias!==null?` Average actual hold has been ${x.bias>=0?"+":""}${x.bias.toFixed(2)} mil versus recommendation.`:""}<br><span class="small">Advisory only; it does not silently change this solution.</span></div>`}
function inferActualCondition(stage,tt){const act=n(tt.actualHold),lo=n(tt.kMin),hi=n(tt.kMax);if(act===null||lo===null||hi===null||hi===lo||!stage.preShootSolution)return null;const ps=stage.preShootSolution.targets?.find(x=>x.targetId===tt.id||x.label===tt.label);if(!ps)return null;const wf=stage.preShootSolution.wind;if(!wf)return null;const rel=sdelta(wf.dir,n(tt.dof)||0),factor=Math.abs(Math.sin(rel*Math.PI/180));if(factor<.08)return {fv:null,env:null,angle:wf.dir,confidence:"LOW"};const pos=(act-lo)/(hi-lo),fv=(wf.low*factor)+pos*((wf.high-wf.low)*factor),env=fv/factor;return {fv,env,angle:wf.dir,confidence:(pos>=0&&pos<=1)?"MODERATE":"LOW"}}
function renderPost(s){
 live.innerHTML=`<div class="cardhead"><div><h3>Post-stage</h3><div class="small">Record what actually worked</div></div><span class="tag done">LEARNING</span></div>
 ${s.targets.map((t,i)=>`<div class="targetCard"><div class="targetHeader"><strong>${t.label} • ${t.distanceM} m</strong><span class="tag ready">TARGET ${i+1}</span></div><div class="grid two">${f("Actual working hold","act_"+i,t.actualHold,"decimal")}<label>Side<select id="side_${i}"><option ${t.holdSide==="L"?"selected":""}>L</option><option ${t.holdSide==="R"?"selected":""}>R</option></select></label></div></div>`).join("")}
 <div class="grid two">${f("Score / impacts","score",s.score,"numeric")}${f("Points possible","pts",s.pointsAvailable,"numeric")}</div>
 ${ta("Stage notes","postNotes",s.postNotes)}
 <div id="postMsg"></div>
 <div class="actions"><button class="btn" id="completeStage">MARK STAGE COMPLETE</button></div>`;
 bindAuto(captureLive);
 completeStage.textContent=s.correctionMode?"SAVE CORRECTION":"MARK STAGE COMPLETE";completeStage.onclick=()=>{captureLive();if(!validPost(s))return;if(!s.preShootSnapshot){alert("Pre-shoot snapshot missing. Return to SHOOT before completing this stage.");return;}const wasCorrection=!!s.completedAt;if(!s.completedAt)s.completedAt=iso();else s.correctedAt=iso();s.correctionMode=false;s.postStageSnapshot={createdAt:iso(),data:JSON.parse(JSON.stringify(s))};const mm=st.data.matches.find(x=>x.id===st.selectedMatch);if(wasCorrection&&mm?.completedAt){mm.revisionHistory=mm.revisionHistory||[];if(mm.finalSnapshot)mm.revisionHistory.push({createdAt:iso(),snapshot:mm.finalSnapshot});mm.correctedAt=iso();const copy=JSON.parse(JSON.stringify(mm));delete copy.finalSnapshot;mm.finalSnapshot=copy;}writeNow();st.screen="matchWizard";st.step=3;render()};
}
function validPost(s){
 let sc=n(s.score),pa=n(s.pointsAvailable),msg=[];
 if(sc!==null&&pa!==null&&(sc<0||sc>pa))msg.push("Score / impacts must be between 0 and points possible.");
 postMsg.innerHTML=msg.length?`<div class="bad">${msg.join(" ")}</div>`:"";
 return !msg.length;
}
function captureLive(){let s=getStage();if(!s)return;if(st.liveStep===0)s.targets.forEach((tt,i)=>tt.dof=angleValue(v("dof_"+i)));if(st.liveStep===1){s.wind.min=whole(v("wmin"));s.wind.avg=whole(v("wavg"));s.wind.max=whole(v("wmax"));s.wind.now=whole(v("wnow"));s.wind.avgDir=angleValue(v("wdir"));s.wind.nowDir=String(v("wndir")).trim()===""?"":angleValue(v("wndir"));s.wind.window=v("wwin");s.wind.terrain=v("wterrain")||"Open / normal"}if(st.liveStep===2){s.points.forEach((p,pi)=>{p.distanceM=v("pd_"+pi);p.terrain=v("pt_"+pi);p.obs.forEach((o,oi)=>{o.indicator=v(`oi_point_${pi}_${oi}`)||o.indicator;o.behavior=+(v(`ob_point_${pi}_${oi}`)||0);o.quality=v(`oq_point_${pi}_${oi}`)||o.quality;if(o.quality!=="Unknown")o.dir=angleValue(v(`od_point_${pi}_${oi}`))})})}if(st.liveStep===3){s.targetTerrain=v("targetTerrain")||s.targetTerrain||"Open / normal";s.targetObs.forEach((o,oi)=>{o.indicator=v(`oi_target_0_${oi}`)||o.indicator;o.behavior=+(v(`ob_target_0_${oi}`)||0);o.quality=v(`oq_target_0_${oi}`)||o.quality;if(o.quality!=="Unknown")o.dir=angleValue(v(`od_target_0_${oi}`))})}if(st.liveStep===4){s.intel.forEach((x,i)=>{x.target=v("intelT_"+i);x.hold=normDec(v("intelH_"+i))})}if(st.liveStep===5)s.targets.forEach((tt,i)=>{tt.kMin=normDec(v("kmin_"+i));tt.kMax=normDec(v("kmax_"+i))});if(st.liveStep===7){s.targets.forEach((tt,i)=>{tt.actualHold=normDec(v("act_"+i));tt.holdSide=v("side_"+i)});s.score=v("score");s.pointsAvailable=v("pts");s.postNotes=v("postNotes")}s.lastModifiedAt=iso();autosave()}
function whole(x){let z=n(x);return z===null?"":String(Math.round(z))}
function getStage(){let m=st.data.matches.find(x=>x.id===st.selectedMatch);return m?.stages.find(x=>x.id===st.selectedStage)}

function svgLine(values,minV,maxV,label){const w=600,h=160,p=24;if(!values.length)return `<div class="note">No ${label} data yet.</div>`;if(maxV===minV)maxV=minV+1;const pts=values.map((vv,i)=>{const x=p+(w-2*p)*(values.length===1?.5:i/(values.length-1)),y=h-p-(h-2*p)*(vv-minV)/(maxV-minV);return `${x.toFixed(1)},${y.toFixed(1)}`}).join(" ");return `<svg class="reportChart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#009abf" stroke-width="4"/></svg><div class="reportLegend">${label}: ${values.map(vv=>Number(vv).toFixed(1)).join(" • ")}</div>`}
function reportStageCapture(s){let total=0,inside=0;(s.targets||[]).forEach(tt=>{const a=n(tt.actualHold),lo=n(tt.kMin),hi=n(tt.kMax);if(a!==null&&lo!==null&&hi!==null){total++;if(a>=Math.min(lo,hi)&&a<=Math.max(lo,hi))inside++}});return {total,inside,pct:total?100*inside/total:null}}
function reports(){setBottom(false);const matches=st.data.matches.filter(m=>!m.archivedAt);main.innerHTML=`<div class="panel"><div class="kicker">Match analytics</div><h2>Reports</h2><div id="rep"></div></div>`;if(!matches.length){rep.innerHTML=`<div class="note">No match history yet.</div>`;return}rep.innerHTML=matches.slice().reverse().map(m=>{const done=m.stages.filter(s=>s.completedAt),score=done.reduce((x,s)=>x+(n(s.score)||0),0),avail=done.reduce((x,s)=>x+(n(s.pointsAvailable)||0),0);let bt=0,bi=0,errs=[];done.forEach(s=>{const c=reportStageCapture(s);bt+=c.total;bi+=c.inside;const sol=s.preShootSolution;if(sol)s.targets.forEach(tt=>{const ps=sol.targets?.find(x=>x.targetId===tt.id||x.label===tt.label),aa=n(tt.actualHold);if(ps&&aa!==null&&ps.recommendedHold!==null){const as=(tt.holdSide==="R"?1:-1)*aa,pr=(ps.recommendedSide==="R"?1:-1)*ps.recommendedHold;errs.push(Math.abs(as-pr))}})});const cap=bt?100*bi/bt:null,mae=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null,windAvg=done.map(s=>n(s.wind?.avg)).filter(x=>x!==null),windDir=done.map(s=>n(s.wind?.avgDir)).filter(x=>x!==null),stagePct=done.map(s=>n(s.pointsAvailable)>0?100*n(s.score)/n(s.pointsAvailable):0);return `<div class="card"><div class="cardhead"><div><strong>${esc(m.name)}</strong><div class="small">${done.length}/${m.stages.length} stages complete</div></div><span class="tag done">${avail?(100*score/avail).toFixed(1)+"%":"—"}</span></div><div class="grid four"><div><div class="small">TOTAL POINTS</div><div class="metric">${score}/${avail||"—"}</div></div><div><div class="small">WIND BRACKET CAPTURE</div><div class="metric">${cap!==null?cap.toFixed(0)+"%":"—"}</div></div><div><div class="small">MEAN HOLD ERROR</div><div class="metric">${mae!==null?mae.toFixed(2):"—"}</div><div class="small">mil</div></div><div><div class="small">AVG WIND</div><div class="metric">${windAvg.length?(windAvg.reduce((a,b)=>a+b,0)/windAvg.length).toFixed(1):"—"}</div><div class="small">mph</div></div></div><div class="note"><strong>WIND BRACKET CAPTURE</strong> = percentage of actual working holds that fell inside the pre-stage MIN–MAX solver hold bracket.</div><h3 style="margin-top:18px">Wind Speed Through Match</h3>${svgLine(windAvg,windAvg.length?Math.min(...windAvg):0,windAvg.length?Math.max(...windAvg):1,"AVG mph")}<h3 style="margin-top:18px">Wind Direction Through Match</h3>${svgLine(windDir,0,360,"WIND FROM °")}<h3 style="margin-top:18px">Stage Score %</h3>${svgLine(stagePct,0,100,"Stage %")}<div class="matchSectionTitle">Stage Summary</div>${done.map(s=>{const c=reportStageCapture(s);return `<div class="listrow"><span>${esc(s.name)} • ${esc(s.wind?.avg||"—")} mph @ ${esc(s.wind?.avgDir||"—")}°</span><strong>${esc(s.score||"—")}/${esc(s.pointsAvailable||"—")} ${c.pct!==null?`• bracket ${c.pct.toFixed(0)}%`:""}</strong></div>`}).join("")||`<div class="note">No completed stages.</div>`}</div>`}).join("")}
function openWheelField(id,title){let el=document.getElementById(id);wheelCtx={type:"field",id,title};openWheel(el?.value||0,title)}
function openObsWheel(where,pi,oi){captureLive();let s=getStage(),o=where==="target"?s.targetObs[oi]:s.points[pi].obs[oi];wheelCtx={type:"obs",where,pi,oi,title:"INDICATOR MOVING TO"};openWheel(o.dir||0,"INDICATOR MOVING TO")}
function openWheel(val,title){wheelTitle.textContent=title;setTimeout(positionTicks,0);document.body.classList.add("modal-open");overlay.classList.remove("hidden");setWheel(n(val)||0)}
function closeWheel(commit=true){if(commit&&wheelCtx){let val=String(Math.round(n(wheelInput.value)||0));if(wheelCtx.type==="field"){let el=document.getElementById(wheelCtx.id);if(el){el.value=val;el.dispatchEvent(new Event("input",{bubbles:true}));captureLive();writeNow()}}else{let s=getStage(),o=wheelCtx.where==="target"?s.targetObs[wheelCtx.oi]:s.points[wheelCtx.pi].obs[wheelCtx.oi];o.dir=val;captureLive();writeNow();if(st.liveStep===2)renderPoints(s);if(st.liveStep===3)renderTargetZone(s)}}overlay.classList.add("hidden");document.body.classList.remove("modal-open");wheelCtx=null}
function setWheel(vv){let d=norm(vv);pointer.style.transform=`rotate(${d}deg)`;wheelDeg.textContent=String(Math.round(d)).padStart(3,"0")+"°";wheelClock.textContent=clock(d);wheelInput.value=String(Math.round(d))}
function evtAngle(e){e.preventDefault();let r=wheel.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.atan2(x,-y)*180/Math.PI;if(d<0)d+=360;setWheel(d)}
wheel.addEventListener("pointerdown",e=>{e.preventDefault();drag=true;wheel.setPointerCapture(e.pointerId);evtAngle(e)},{passive:false});
wheel.addEventListener("pointermove",e=>{if(drag)evtAngle(e)},{passive:false});
wheel.addEventListener("pointerup",e=>{drag=false;e.preventDefault()},{passive:false});
wheel.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
sheet.addEventListener("touchmove",e=>{if(e.target.closest(".wheel"))e.preventDefault()},{passive:false});
overlay.addEventListener("touchmove",e=>{if(e.target===overlay)e.preventDefault()},{passive:false});
wheelInput.addEventListener("input",()=>setWheel(n(wheelInput.value)||0));wheelDone.onclick=()=>closeWheel(true);
function positionTicks(){const size=wheel.clientWidth,c=size/2,r=size*.413;[...wheel.querySelectorAll(".tick")].forEach((el,idx)=>{let deg=(idx+1)*30,rad=(deg-90)*Math.PI/180;el.style.left=(c+r*Math.cos(rad))+"px";el.style.top=(c+r*Math.sin(rad))+"px"})}
for(let h=1;h<=12;h++){let el=document.createElement("div");el.className="tick";el.textContent=h;wheel.appendChild(el)}
window.addEventListener("resize",positionTicks);setTimeout(positionTicks,0);

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}
safeRead();render();hydrateFromIDB();
</script>
